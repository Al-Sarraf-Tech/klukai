[Unit]
# The existing lazy proxy may request a start, but systemd must refuse while a
# GameMode session owns the GPU. /run/user/1000 is ephemeral, so stale markers
# cannot survive a reboot.
ConditionPathExists=!/run/user/1000/dominus-gpu/game-active
ConditionPathExists=!/run/user/1000/dominus-gpu/non-llm-lease.json
ConditionPathIsMountPoint=/mnt/nvmer0

[Service]
ExecStartPre=/usr/bin/mountpoint --quiet /mnt/nvmer0
ExecStartPre=/usr/bin/test -d /mnt/nvmer0/services/ai-stack/logs/vllm
ExecStartPre=/usr/bin/test -d /mnt/nvmer0/services/ai-stack/cache/vllm
ExecStartPre=/usr/bin/test -x /mnt/nvmer0/ai/vllm/bin/python
ExecStartPre=/usr/bin/test -r /mnt/nvmer0/models/qwen3-coder-30b-awq/config.json
ExecStartPre=/usr/bin/test -r /mnt/nvmer0/models/qwen3-0.6b-draft/config.json
ExecStartPre=/home/jalsarraf/.local/bin/dominus-vllm-vram-preflight
Environment=XDG_CACHE_HOME=/mnt/nvmer0/services/ai-stack/cache/vllm
Environment=HF_HOME=/mnt/nvmer0/services/ai-stack/cache/vllm/huggingface
Environment=HF_HUB_CACHE=/mnt/nvmer0/services/ai-stack/cache/vllm/huggingface/hub
Environment=HUGGINGFACE_HUB_CACHE=/mnt/nvmer0/services/ai-stack/cache/vllm/huggingface/hub
Environment=TORCH_HOME=/mnt/nvmer0/services/ai-stack/cache/vllm/torch
Environment=TRITON_CACHE_DIR=/mnt/nvmer0/services/ai-stack/cache/vllm/triton
Environment=VLLM_CACHE_ROOT=/mnt/nvmer0/services/ai-stack/cache/vllm/vllm
StandardOutput=append:/mnt/nvmer0/services/ai-stack/logs/vllm/vllm-server.log
StandardError=append:/mnt/nvmer0/services/ai-stack/logs/vllm/vllm-server.log
