[Unit]
# The AI stack publishes on the stable Tailscale address. dockerd must not
# restore those containers until the address exists, or the bind fails once
# and is never retried. Wants, not Requires: Tailscale being down must not
# stop Docker itself.
After=tailscaled.service
Wants=tailscaled.service

[Service]
# The leading `-` makes a failing, missing, or non-executable repair script a
# logged no-op instead of a docker.service start failure. The script already
# exits 0 after its 60-second wait; the prefix covers the install path being
# absent (fresh host, partial install) for the same reason as Wants above:
# the Tailscale wait must never be what stops Docker.
ExecStartPre=-/usr/local/sbin/dominus-repair-tailscale-publish --wait-for-address
