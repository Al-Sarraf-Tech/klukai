[Unit]
# The AI stack publishes on the stable Tailscale address. dockerd must not
# restore those containers until the address exists, or the bind fails once
# and is never retried. Wants, not Requires: Tailscale being down must not
# stop Docker itself.
After=tailscaled.service
Wants=tailscaled.service

[Service]
ExecStartPre=/usr/local/sbin/dominus-repair-tailscale-publish --wait-for-address
