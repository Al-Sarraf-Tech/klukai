[Unit]
# Docker's image metadata must never fall back to the root filesystem if the
# RAID is absent. RequiresMountsFor also establishes the mount dependency;
# the explicit After keeps the intended ordering obvious in unit diagnostics.
RequiresMountsFor=/mnt/nvmer0
After=mnt-nvmer0.mount

[Service]
ExecStartPre=/usr/bin/mountpoint --quiet /mnt/nvmer0
