version = 1

; Shared settings for the RTX 3090. Router process policy (one model maximum
; and the hard 900-second maximum idle residency) lives in Compose and cannot be changed
; by this preset or by clients.
[*]
ctx-size = 32768
n-gpu-layers = all
flash-attn = on
cache-type-k = q8_0
cache-type-v = q8_0
parallel = 1
batch-size = 1024
ubatch-size = 256
jinja = true

[unsloth/gemma-4-26b-a4b-it]
model = /models/llm/unsloth-gemma-4-26b-a4b-it/gemma-4-26B-A4B-it-UD-Q4_K_M.gguf
mmproj = /models/llm/unsloth-gemma-4-26b-a4b-it/mmproj-BF16.gguf
ctx-size = 134144

[cognitivecomputations_dolphin-mistral-24b-venice-edition]
