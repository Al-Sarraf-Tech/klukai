# git-cliff config — S+ Phase 3, conventional-commits → CHANGELOG.md
#
# Generates per-tag CHANGELOG entries grouped by commit type, sorted by
# subject. Conventional Commits parsing is strict; non-conformant commits
# fall under "Other" so they're visible and can be backfilled.
#
# Usage:
#   git cliff --unreleased --tag vX.Y.Z >> CHANGELOG.md
#   git cliff --latest                                  # last release only
#   git cliff -o CHANGELOG.md                           # full regen
#
# Per docs/superpowers/specs/2026-05-16-s-plus-uplift.md §7.6.

[changelog]
header = """
# Changelog

All notable changes to klukai are documented here. The format is based on
[Keep a Changelog](https://keepachangelog.com/en/1.1.0/), and klukai
adheres to [Semantic Versioning](https://semver.org/spec/v2.0.0.html).

Generated by [git-cliff](https://git-cliff.org/) from conventional-commit
messages (see `docs/superpowers/specs/2026-05-16-s-plus-uplift.md`).

"""

body = """
{% if version %}\
## [{{ version | trim_start_matches(pat="v") }}] — {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## [Unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | upper_first }}
{% for commit in commits %}
- {{ commit.message | upper_first | trim }}\
    {%- if commit.scope %} *({{ commit.scope }})*{% endif %}\
    {%- if commit.id %} ([{{ commit.id | truncate(length=7, end="") }}]({{ "https://github.com/Al-Sarraf-Tech/klukai/commit/" ~ commit.id }})){% endif %}
{% endfor %}\
{% endfor %}\n
"""

trim = true
footer = "<!-- generated by git-cliff -->"

[git]
conventional_commits = true
filter_unconventional = false
split_commits = false
commit_parsers = [
  { message = "^feat", group = "Added" },
  { message = "^fix", group = "Fixed" },
  { message = "^perf", group = "Performance" },
  { message = "^refactor", group = "Refactor" },
  { message = "^docs", group = "Documentation" },
  { message = "^test", group = "Tests" },
  { message = "^ci", group = "CI/CD" },
  { message = "^build", group = "Build" },
  { message = "^chore", group = "Chore" },
  { message = "^style", group = "Style" },
  { message = "^security", group = "Security" },
  { message = "^revert", group = "Reverted" },
  { message = ".*", group = "Other" },
]
filter_commits = false
tag_pattern = "v[0-9]+\\.[0-9]+\\.[0-9]+"
sort_commits = "newest"
