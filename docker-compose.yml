# Run on amarillo: companion-core (consolidated with aichat infra)
# Shares Docker networks with infra-postgres, redis, qdrant locally
# companion-voice remains on dominus-nobara (RTX 3090, CUDA required)
# Pin the compose project name so `docker compose` (and every Makefile target)
# acts on the live stack instead of the directory-default `klukai` project.
name: companion

services:
  companion-core:
    build: ./docker/core
    container_name: companion-core
    ports:
      - "127.0.0.1:8300:8300"
    environment:
      # aichat services on amarillo (LAN via Docker network)
      DATABASE_URL: "postgresql://aichat:${POSTGRES_PASSWORD:?}@infra-postgres:5432/aichat"
      REDIS_URL: "redis://aichat-redis:6379/1"
      QDRANT_URL: "http://aichat-vector:6333"
      MCP_URL: "http://aichat-mcp:8096"
      DATA_URL: "http://aichat-data:8091"
      INFERENCE_URL: "http://aichat-inference:8105"
      # GPU services on dominus-nobara over its literal Tailscale address.
      # Overrides are for isolated integration tests only; production must not
      # use an RFC1918/LAN endpoint.
      VOICE_URL: "${VOICE_URL:-http://100.107.121.5:8301}"
      # Must match the canonical target stack's VOICE_API_TOKEN.
      VOICE_API_TOKEN: "${VOICE_API_TOKEN:?VOICE_API_TOKEN is required}"
      # LM Studio backend. Default: dominus-nobara RTX 3090 over Tailscale (auth required).
      # Override LM_STUDIO_URL only for isolated integration testing. The core
      # always sends the required bearer header; test backends may ignore it.
      LM_STUDIO_URL: "${LM_STUDIO_URL:-http://100.107.121.5:1234}"
      LM_STUDIO_TOKEN: "${LM_STUDIO_TOKEN:?LM_STUDIO_TOKEN is required}"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      # ComfyUI has no published raw port. Every operation is proxied by the
      # authenticated gateway and authorized again with the active GPU lease.
      COMFYUI_URL: "${COMFYUI_URL:-http://100.107.121.5:1234/api/v1/comfy}"
      PERSONALITY_PATH: "/config/personality.yaml"
      # Commander's location for weather-driven mood (Open-Meteo, keyless).
      # Defaults to Chicago; override in .env. Weather is fail-soft — if unset
      # or the API is unreachable, mood/greeting just ignore weather.
      COMMANDER_LATITUDE: "${COMMANDER_LATITUDE:-41.8781}"
      COMMANDER_LONGITUDE: "${COMMANDER_LONGITUDE:--87.6298}"
      # Where Klukai's voice letters (async JP voice notes) are stored.
      AUDIO_DIR: "/audio"
      VAPID_PRIVATE_KEY: "${VAPID_PRIVATE_KEY:-}"
      VAPID_PUBLIC_KEY: "${VAPID_PUBLIC_KEY:-}"
      # Signing secrets for HMAC URL signing + audit-chain. If unset, the app
      # self-generates a strong ephemeral one (never the old guessable default).
      # Set in .env for cross-restart stability (audit-chain continuity).
      SIGNED_URL_SECRET: "${SIGNED_URL_SECRET:-}"
      AUDIT_CHAIN_SECRET: "${AUDIT_CHAIN_SECRET:-}"
      SEED_PASSWORD_JALSARRAF: "${SEED_PASSWORD_JALSARRAF:-}"
      SEED_PASSWORD_RICKY: "${SEED_PASSWORD_RICKY:-}"
      SEED_PASSWORD_MIGUEL: "${SEED_PASSWORD_MIGUEL:-}"
      SEED_PASSWORD_BLACKMAN: "${SEED_PASSWORD_BLACKMAN:-}"
      # OTel exporter — wired to the obs stack in docker-compose.obs.yml.
      # If the obs stack isn't running, OTel init fail-soft (no-op) per
      # app/observability/tracing.py.
      OTEL_EXPORTER_OTLP_ENDPOINT: "${OTEL_EXPORTER_OTLP_ENDPOINT:-http://klukai-alloy:4317}"
      OTEL_SERVICE_NAME: "klukai-core"
      # Personal mode — every user is elite, all features on, quotas disabled.
      # Flip to "false" to honor companion_subscriptions tier rows. See ADR-0017.
      KLUKAI_PERSONAL_MODE: "${KLUKAI_PERSONAL_MODE:-true}"
    volumes:
      - ./config:/config:ro
      - ./web-build:/app/static:ro
      - companion-images:/images
      - companion-audio:/audio
    deploy:
      resources:
        limits:
          memory: 1g
    networks:
      - default
      - aichat
      - infra
      - obs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8300/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    labels:
      autoheal: "true"

  # companion-voice runs in the canonical ops/dominus-nobara stack on RAID0.
  # Reachable only at the target Tailscale address on port 8301.

volumes:
  companion-images:
  companion-audio:

networks:
  aichat:
    external: true
    name: aichat_default
  infra:
    external: true
  obs:
    external: true
    name: klukai-obs
