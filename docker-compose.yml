# Run on amarillo: companion-core, its own Redis (companion-redis) and the
# events bridge. PostgreSQL is the shared infra-postgres (database "aichat",
# Klukai's own data under an old name). Nothing here uses the aichat stack.
# All of Klukai's AI is cloud (Anthropic, Fish Audio, the image accounts).
# Pin the compose project name so `docker compose` (and every Makefile target)
# acts on the live stack instead of the directory-default `klukai` project.
name: companion

services:
  companion-core:
    build: ./docker/core
    container_name: companion-core
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    # Preserve owned GPU cleanup before closing clients/database. The audited
    # conservative async cleanup phases total573s; native/driver teardown must
    # cooperate. See the shutdown runbook before shortening this budget.
    stop_grace_period: 10m
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=128m,mode=1777
    ports:
      - "127.0.0.1:8300:8300"
    environment:
      DATABASE_URL: "postgresql://aichat:${POSTGRES_PASSWORD:?}@infra-postgres:5432/aichat"
      # Klukai's own Redis (decoupled from the aichat stack, 2026-10-27).
      REDIS_URL: "redis://:${KLUKAI_REDIS_PASSWORD:?Klukai Redis password required}@companion-redis:6379/0"
      # Shared secret for /internal/deferred/fire (events-bridge -> core).
      # Fails closed: unset means the endpoint rejects everyone.
      CORE_INTERNAL_TOKEN: "${CORE_INTERNAL_TOKEN:-}"
      # queue = durable RabbitMQ work rail (one job at a time via the bridge).
      # inline = in-process asyncio task (unit tests / bridge outage fallback).
      HER_POV_EXECUTION: "${HER_POV_EXECUTION:-queue}"
      # Opt-in, scoped web/reference tools from existing host MCP servers.
      # Empty means no external tools (there is no aichat-mcp fallback).
      KLUKAI_MCP_CONFIG: "${KLUKAI_MCP_CONFIG:-}"
      KLUKAI_BRAVE_ENABLED: "${KLUKAI_BRAVE_ENABLED:-false}"
      # Cloud AI only (owner, 2026-10-26): no model, embedding, voice or image
      # service on Dominus-Nobara or Amarillo is used by core.
      # Voice in and out is Fish Audio. Off, core sends no speech work at all.
      KLUKAI_VOICE_ENABLED: "${KLUKAI_VOICE_ENABLED:-false}"
      # Opt-in submit/poll speech for long lines.
      VOICE_ASYNC_JOBS: "${VOICE_ASYNC_JOBS:-false}"
      # Voice is Fish Audio only (cloud), both directions, with one key:
      # - speech: the community "Klukai" model (Danastico) on a free model
      #   header (s2.1-pro-free is free through 2026-11-30); core refuses an
      #   empty key/model and any model not ending in "-free".
      # - transcription: transcribe-1-pro, pay-as-you-go ($0.36 per audio
      #   hour, owner authorized 2026-10-26). It needs API credit on the Fish
      #   account and fails closed without it. No key: voice input is off.
      FISH_API_KEY: "${FISH_API_KEY:-}"
      KLUKAI_FISH_VOICE_ID: "${KLUKAI_FISH_VOICE_ID:-47fc35b7311944bc9fa238ed856de1f3}"
      KLUKAI_FISH_MODEL: "${KLUKAI_FISH_MODEL:-s2.1-pro-free}"
      # Chat is account-login Grok through the host worker (owner, 2026-10-30).
      # These Claude variables are not the chat path and do not open a client.
      KLUKAI_CLAUDE_PRIMARY: "${KLUKAI_CLAUDE_PRIMARY:-false}"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      # agy is the account-worker bridge. The host unit selects Grok.
      KLUKAI_IMAGE_PROVIDER: "${KLUKAI_IMAGE_PROVIDER:-agy}"
      # Account-quota Agy worker on Amarillo; no credentials enter this container.
      KLUKAI_CHAT_IMAGE_PROVIDER: "${KLUKAI_CHAT_IMAGE_PROVIDER:-}"
      KLUKAI_AGY_ALLOWED_USERS: "${KLUKAI_AGY_ALLOWED_USERS:-}"
      # Background pictures through the same worker (allowlisted users only).
      # A missing Live Portrait base: at most this many new ones a local day
      # (0 = off). Album seeding: renders per run and per local day, 0 = off,
      # never more than 2; also needs the amarillo seed timer enabled.
      KLUKAI_PORTRAIT_DAILY_LIMIT: "${KLUKAI_PORTRAIT_DAILY_LIMIT:-3}"
      KLUKAI_ALBUM_SEED_RENDERS: "${KLUKAI_ALBUM_SEED_RENDERS:-0}"
      KLUKAI_AGY_SOCKET: "/run/klukai-agy/image.sock"
      KLUKAI_AGY_TOKEN_FILE: "/run/klukai-agy/token"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      KLUKAI_OPENAI_IMAGE_MODEL: "${KLUKAI_OPENAI_IMAGE_MODEL:-gpt-image-2.5-sunburst-2026-09-08}"
      KLUKAI_OPENAI_IMAGE_QUALITY: "${KLUKAI_OPENAI_IMAGE_QUALITY:-max}"
      KLUKAI_IMAGE_REFERENCE_FILES: "${KLUKAI_IMAGE_REFERENCE_FILES:-[]}"
      KLUKAI_CREATIVE_TEXT_PROVIDER: "${KLUKAI_CREATIVE_TEXT_PROVIDER:-haiku}"
      KLUKAI_CLOUD_IMAGE_DAILY_LIMIT: "${KLUKAI_CLOUD_IMAGE_DAILY_LIMIT:-0}"
      KLUKAI_CLOUD_IMAGE_MONTHLY_LIMIT: "${KLUKAI_CLOUD_IMAGE_MONTHLY_LIMIT:-0}"
      KLUKAI_CLOUD_TEXT_DAILY_LIMIT: "${KLUKAI_CLOUD_TEXT_DAILY_LIMIT:-0}"
      KLUKAI_CLOUD_TEXT_MONTHLY_LIMIT: "${KLUKAI_CLOUD_TEXT_MONTHLY_LIMIT:-0}"
      KLUKAI_CREATIVE_LEDGER: "/images/.creative/attempts.sqlite3"
      # Grok 4.7 (medium) for every background text/JSON call and for memory
      # recall (owner, 2026-10-30; docker/core/app/background_llm.py). Calls
      # need the host worker and a positive daily cap (UTC-day attempts shared
      # by all of it, same ledger); at the cap, callers use their safe defaults.
      KLUKAI_EXTRACTION_MODEL: "${KLUKAI_EXTRACTION_MODEL:-claude-haiku-5-5}"
      KLUKAI_EXTRACTION_DAILY_LIMIT: "${KLUKAI_EXTRACTION_DAILY_LIMIT:-0}"
      PERSONALITY_PATH: "/config/personality.yaml"
      # Commander's location for weather-driven mood (Open-Meteo, keyless).
      # Defaults to Chicago; override in .env. Weather is fail-soft — if unset
      # or the API is unreachable, mood/greeting just ignore weather.
      COMMANDER_LATITUDE: "${COMMANDER_LATITUDE:-41.8781}"
      COMMANDER_LONGITUDE: "${COMMANDER_LONGITUDE:--87.6298}"
      # Where Klukai's voice letters (async JP voice notes) are stored.
      AUDIO_DIR: "/audio"
      VAPID_PRIVATE_KEY: "${VAPID_PRIVATE_KEY:-}"
      VAPID_PUBLIC_KEY: "${VAPID_PUBLIC_KEY:-}"
      # Signing secrets for HMAC URL signing + audit-chain. If unset, the app
      # self-generates a strong ephemeral one (never the old guessable default).
      # Set in .env for cross-restart stability (audit-chain continuity).
      SIGNED_URL_SECRET: "${SIGNED_URL_SECRET:-}"
      AUDIT_CHAIN_SECRET: "${AUDIT_CHAIN_SECRET:-}"
      SEED_PASSWORD_JALSARRAF: "${SEED_PASSWORD_JALSARRAF:-}"
      SEED_PASSWORD_RICKY: "${SEED_PASSWORD_RICKY:-}"
      SEED_PASSWORD_MIGUEL: "${SEED_PASSWORD_MIGUEL:-}"
      SEED_PASSWORD_BLACKMAN: "${SEED_PASSWORD_BLACKMAN:-}"
      # OTel exporter — wired to the obs stack in docker-compose.obs.yml.
      # If the obs stack isn't running, OTel init fail-soft (no-op) per
      # app/observability/tracing.py.
      OTEL_EXPORTER_OTLP_ENDPOINT: "${OTEL_EXPORTER_OTLP_ENDPOINT:-http://klukai-alloy:4317}"
      OTEL_SERVICE_NAME: "klukai-core"
      KLUKAI_METRICS_TOKEN_FILE: "/run/klukai-secrets/metrics-token"
      # Personal mode — every user is elite, all features on, quotas disabled.
      # Flip to "false" to honor companion_subscriptions tier rows. See ADR-0017.
      KLUKAI_PERSONAL_MODE: "${KLUKAI_PERSONAL_MODE:-true}"
    volumes:
      - ./config:/config:ro
      - ${KLUKAI_MCP_SECRETS_DIR:-./.mcp-secrets}:/run/klukai-mcp:ro
      - ${KLUKAI_AGY_RUNTIME_DIR:-./.agy-runtime}:/run/klukai-agy:ro
      # Only the dedicated metrics token's directory: a tmpfs copy written at boot
      # from the encrypted store by klukai-runtime-secrets.service (system unit).
      # Core starts without it; /internal/metrics then answers 401.
      - ${KLUKAI_RUNTIME_SECRETS_DIR:-/run/klukai-secrets/metrics}:/run/klukai-secrets:ro
      - ./web-build:/app/static:ro
      - companion-images:/images
      - companion-audio:/audio
      # Her 3D avatar (tools/avatar build output; game-derived, gitignored).
      # Served only by the authenticated GET /api/avatar/model — never as /app static.
      - ./assets/build:/avatar:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 1g
    networks:
      - default
      - infra
      - obs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/opt/venv/bin/python", "/app/healthcheck.py"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    labels:
      autoheal: "true"

  # Klukai's own Redis: rate limits, caches, session state and the
  # companion:events channel. No published port; only this project's network.
  redis:
    image: valkey/valkey@sha256:cb3339abbd6e18942cd8ac3349f0c371a82ba5b6204b242563ba299e7956cbd0
    container_name: companion-redis
    # The image's valkey user; the named volume inherits /data's ownership.
    user: "999:1000"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      KLUKAI_REDIS_PASSWORD: "${KLUKAI_REDIS_PASSWORD:?Klukai Redis password required}"
    # The password reaches valkey on stdin, never on its command line.
    # Every key core writes has a TTL, so eviction only ever drops expiring
    # state (volatile-lru) under the 200 MB cap. Commands core never uses that
    # could wipe or reconfigure the store are disabled.
    command: ["sh", "-c", "exec valkey-server - <<EOF\nappendonly yes\nsave 3600 1 300 100 60 10000\nmaxmemory 200mb\nmaxmemory-policy volatile-lru\nrename-command FLUSHALL \"\"\nrename-command FLUSHDB \"\"\nrename-command CONFIG \"\"\nrename-command DEBUG \"\"\nrequirepass $$KLUKAI_REDIS_PASSWORD\nEOF\n"]
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=8m
    volumes:
      - companion-redis:/data
    deploy:
      resources:
        limits:
          memory: 256m
    networks:
      - default
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$KLUKAI_REDIS_PASSWORD\" valkey-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    labels:
      autoheal: "true"

  # Fan companion Redis events onto the shared homelab RabbitMQ bus
  # (see ~/git/rabbitmq-ops). Reachable over Tailscale AMQP only.
  events-bridge:
    build: ./docker/events-bridge
    container_name: companion-events-bridge
    environment:
      REDIS_URL: "redis://:${KLUKAI_REDIS_PASSWORD:?Klukai Redis password required}@companion-redis:6379/0"
      REDIS_CHANNEL: "companion:events"
      RABBIT_HOST: "${RABBIT_HOST:-100.111.198.19}"
      RABBIT_PORT: "${RABBIT_PORT:-5672}"
      RABBIT_USER: "${RABBIT_USER:-homelab}"
      RABBIT_PASS: "${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required for events-bridge}"
      LOCAL_HOSTNAME: "${LOCAL_HOSTNAME:-amarillo}"
      # Deferred-task rail: the bridge runs the timer and calls core back when
      # a task comes due. Unset token => core rejects the callback (fail closed)
      # and the core-side sweeper delivers instead, just less punctually.
      CORE_URL: "${CORE_URL:-http://companion-core:8300}"
      CORE_INTERNAL_TOKEN: "${CORE_INTERNAL_TOKEN:-}"
    depends_on:
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 64m
    networks:
      - default
    restart: unless-stopped
    labels:
      autoheal: "true"


volumes:
  companion-images:
  companion-audio:
  companion-redis:

networks:
  infra:
    external: true
  obs:
    external: true
    name: klukai-obs
