# Run on dominus: companion-core + companion-voice
# Reaches aichat services on amarillo via Tailscale (100.111.198.19)
# Web traffic arrives via companion-gateway on amarillo → here
services:
  companion-core:
    build: ./docker/core
    container_name: companion-core
    ports:
      - "8300:8300"
    environment:
      # aichat services on amarillo (LAN via Docker network)
      DATABASE_URL: "postgresql://aichat:${POSTGRES_PASSWORD:?}@aichat-db:5432/aichat"
      REDIS_URL: "redis://aichat-redis:6379/1"
      QDRANT_URL: "http://aichat-vector:6333"
      MCP_URL: "http://aichat-mcp:8096"
      DATA_URL: "http://aichat-data:8091"
      INFERENCE_URL: "http://aichat-inference:8105"
      # Voice on dominus (LAN)
      VOICE_URL: "http://192.168.50.2:8301"
      # LM Studio on dominus (LAN)
      LM_STUDIO_URL: "http://192.168.50.2:1234"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      # ComfyUI on dominus (LAN)
      COMFYUI_URL: "http://192.168.50.2:8188"
      PERSONALITY_PATH: "/config/personality.yaml"
      VAPID_PRIVATE_KEY: "${VAPID_PRIVATE_KEY:-}"
      VAPID_PUBLIC_KEY: "${VAPID_PUBLIC_KEY:-}"
      SEED_PASSWORD_JALSARRAF: "${SEED_PASSWORD_JALSARRAF:-}"
      SEED_PASSWORD_RICKY: "${SEED_PASSWORD_RICKY:-}"
      SEED_PASSWORD_MIGUEL: "${SEED_PASSWORD_MIGUEL:-}"
      SEED_PASSWORD_BLACKMAN: "${SEED_PASSWORD_BLACKMAN:-}"
    volumes:
      - ./config:/config:ro
      - ./web-build:/app/static:ro
      - companion-images:/images
    networks:
      - default
      - aichat
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8300/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  companion-voice:
    build: ./docker/voice
    container_name: companion-voice
    environment:
      TTS_ENGINE: "xtts"
      REFERENCE_WAV: "/app/reference/klukai_reference.wav"
      WHISPER_MODEL: "${WHISPER_MODEL:-base.en}"
      TTS_HOME: "/app/models/tts"
    volumes:
      - voice-models:/app/models
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8301/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

volumes:
  voice-models:
  companion-images:

networks:
  aichat:
    external: true
    name: aichat_default
