<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Klukai 3D Debug</title>
<style>
  body { margin: 0; background: #12151E; color: #ccc; font-family: monospace; }
  #info { position: absolute; top: 10px; left: 10px; z-index: 10; font-size: 12px; white-space: pre; }
  canvas { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<div id="info">Loading...</div>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.168.0/build/three.module.min.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.168.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const info = document.getElementById('info');
function log(msg) { info.textContent += '\n' + msg; console.log(msg); }

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x12151E);

const camera = new THREE.PerspectiveCamera(30, window.innerWidth / window.innerHeight, 0.01, 1000);
camera.position.set(0, 1.2, 3);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

// Orbit controls to explore the scene
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 1, 0);
controls.update();

// Lights
scene.add(new THREE.AmbientLight(0xffffff, 0.8));
const dir = new THREE.DirectionalLight(0xffffff, 1.0);
dir.position.set(2, 3, 2);
scene.add(dir);

// Grid for reference
scene.add(new THREE.GridHelper(10, 10, 0x4FC3F7, 0x333333));

// Axes helper
scene.add(new THREE.AxesHelper(2));

log('Scene ready. Loading model...');

const loader = new GLTFLoader();
loader.load(
  '/app/assets/models/klukai.glb',
  (gltf) => {
    const model = gltf.scene;

    // Remove junk objects
    const junk = [];
    model.traverse(n => { if (n.name === 'Cube' || n.name === 'Camera' || n.name === 'Light') junk.push(n); });
    junk.forEach(n => n.removeFromParent());
    log('Removed junk: ' + junk.map(n => n.name).join(', '));

    scene.add(model);

    // Log model info
    const box = new THREE.Box3().setFromObject(model);
    const size = box.getSize(new THREE.Vector3());
    const center = box.getCenter(new THREE.Vector3());
    log('Model loaded!');
    log('Bounding box size: ' + size.x.toFixed(2) + ' x ' + size.y.toFixed(2) + ' x ' + size.z.toFixed(2));
    log('Center: ' + center.x.toFixed(2) + ', ' + center.y.toFixed(2) + ', ' + center.z.toFixed(2));
    log('Position: ' + model.position.x.toFixed(2) + ', ' + model.position.y.toFixed(2) + ', ' + model.position.z.toFixed(2));

    // Count meshes
    let meshCount = 0, vertCount = 0;
    model.traverse(n => {
      if (n.isMesh) {
        meshCount++;
        vertCount += n.geometry.attributes.position?.count || 0;
      }
    });
    log('Meshes: ' + meshCount + ', Vertices: ' + vertCount);

    // List animations
    log('Animations (' + gltf.animations.length + '): ' + gltf.animations.map(a => a.name).join(', '));

    // Check materials
    let matInfo = [];
    model.traverse(n => {
      if (n.isMesh && matInfo.length < 5) {
        const m = n.material;
        matInfo.push(n.name + ': ' + m.type + ' visible=' + n.visible + ' opacity=' + m.opacity);
      }
    });
    log('Materials (first 5): \n  ' + matInfo.join('\n  '));

    // Auto-frame camera on model
    camera.position.set(center.x, center.y + size.y * 0.3, center.z + size.y * 1.5);
    controls.target.copy(center);
    controls.update();
    log('Camera framed on model.');
  },
  (progress) => {
    if (progress.total) {
      const pct = ((progress.loaded / progress.total) * 100).toFixed(0);
      info.textContent = 'Loading... ' + pct + '% (' + (progress.loaded / 1024 / 1024).toFixed(1) + ' MB)';
    }
  },
  (error) => {
    log('ERROR loading model: ' + error.message);
    console.error(error);
  }
);

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
