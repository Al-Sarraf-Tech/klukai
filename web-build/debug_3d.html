<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Klukai Skeleton Verify</title>
<style>body{margin:0;background:#12151E;color:#0f0;font-family:monospace;font-size:12px}
#log{position:absolute;top:10px;left:10px;z-index:10;background:rgba(0,0,0,0.8);padding:8px;max-width:45%;white-space:pre-wrap;pointer-events:none;max-height:90vh;overflow-y:auto}</style>
</head>
<body>
<div id="log">Loading...</div>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.168.0/build/three.module.min.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.168.0/examples/jsm/"}}
</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const L = document.getElementById('log');
const log = m => { L.textContent += '\n' + m; console.log(m); };

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x12151E);
const camera = new THREE.PerspectiveCamera(30, innerWidth/innerHeight, 0.01, 100);
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
scene.add(new THREE.AmbientLight(0xffffff, 0.8));
const dl = new THREE.DirectionalLight(0xffffff, 1);
dl.position.set(2,3,2); scene.add(dl);

log('Loading...');
const gltf = await new Promise((resolve, reject) => {
  new GLTFLoader().load('/app/assets/models/klukai.glb', resolve,
    p => { if (p.total) L.textContent = 'Loading... ' + ((p.loaded/p.total)*100).toFixed(0) + '%'; },
    e => { log('ERROR: ' + e.message); reject(e); });
});
const model = gltf.scene;
model.traverse(n => { if (n.name === 'Cube') n.removeFromParent(); });
scene.add(model);

const box = new THREE.Box3().setFromObject(model);
const sz = box.getSize(new THREE.Vector3());
const ct = box.getCenter(new THREE.Vector3());
model.position.set(-ct.x, -box.min.y, -ct.z);
camera.position.set(0, sz.y*0.5, sz.y*1.5);
controls.target.set(0, sz.y*0.45, 0); controls.update();
log('Model loaded: ' + sz.x.toFixed(2) + 'x' + sz.y.toFixed(2));

// Find skeleton
let skel = null;
model.traverse(n => { if (n.isSkinnedMesh && n.name === 'Body' && n.skeleton) skel = n.skeleton; });
if (!skel) model.traverse(n => { if (n.isSkinnedMesh && n.skeleton && (!skel || n.skeleton.bones.length > skel.bones.length)) skel = n.skeleton; });

log('Skeleton: ' + (skel ? skel.bones.length + ' bones' : 'NONE'));
if (skel) {
  log('First 10 bones: ' + skel.bones.slice(0,10).map(b=>b.name).join(', '));

  // Check for DEF- prefix (should be GONE)
  const defBones = skel.bones.filter(b => b.name.startsWith('DEF-'));
  if (defBones.length > 0) log('WARNING: ' + defBones.length + ' DEF- bones still present!');
  else log('✓ No DEF- prefix bones — clean skeleton');
}

// Find key bones
const B = {};
if (skel) {
  for (const bone of skel.bones) {
    if (bone.name === 'Head_M') B.head = bone;
    if (bone.name === 'Spine1_M') B.spine1 = bone;
    if (bone.name === 'Root_M') B.root = bone;
    if (bone.name === 'Shoulder_L') B.shoulderL = bone;
    if (bone.name === 'Shoulder_R') B.shoulderR = bone;
  }
  log('Found bones: ' + Object.entries(B).map(([k,v])=>k+'='+v.name).join(', '));
}

// Weight check
if (skel && B.shoulderL) {
  model.traverse(n => {
    if (n.isSkinnedMesh && n.name === 'Body') {
      const si = n.geometry.attributes.skinIndex;
      const sw = n.geometry.attributes.skinWeight;
      const shoulderIdx = skel.bones.indexOf(B.shoulderL);
      const spineIdx = skel.bones.indexOf(B.spine1);
      let sMax = 0, sCount = 0, spMax = 0, spCount = 0;
      for (let v = 0; v < si.count; v++) {
        for (let c = 0; c < 4; c++) {
          const bi = Math.round(si.getComponent(v, c));
          const w = sw.getComponent(v, c);
          if (bi === shoulderIdx && w > 0.001) { sCount++; sMax = Math.max(sMax, w); }
          if (bi === spineIdx && w > 0.001) { spCount++; spMax = Math.max(spMax, w); }
        }
      }
      log('Shoulder_L: idx=' + shoulderIdx + ' verts=' + sCount + ' maxWeight=' + sMax.toFixed(4));
      log('Spine1_M:   idx=' + spineIdx + ' verts=' + spCount + ' maxWeight=' + spMax.toFixed(4));
      if (sMax > 0.1) log('✓ Shoulder weights are STRONG — rotation should work!');
      else log('✗ Shoulder weights still diluted');
    }
  });
}

// ROTATION TEST: apply large shoulder rotation and verify offset matrix
if (skel && B.shoulderL) {
  log('\n=== ROTATION TEST ===');

  // Before rotation
  model.updateMatrixWorld(true);
  skel.update();
  const idx = skel.bones.indexOf(B.shoulderL);
  const beforeOffset = skel.boneMatrices.slice(idx*16, idx*16+16);
  const beforeIdentity = Math.abs(beforeOffset[0]-1)<0.01 && Math.abs(beforeOffset[5]-1)<0.01 && Math.abs(beforeOffset[10]-1)<0.01;
  log('Before rotation — offset is identity? ' + beforeIdentity);

  // Apply rotation
  const q = new THREE.Quaternion();
  q.setFromAxisAngle(new THREE.Vector3(0, 0, 1), 1.2);
  B.shoulderL.quaternion.multiply(q);

  // Update and check
  model.updateMatrixWorld(true);
  skel.update();
  const afterOffset = skel.boneMatrices.slice(idx*16, idx*16+16);
  const afterIdentity = Math.abs(afterOffset[0]-1)<0.01 && Math.abs(afterOffset[5]-1)<0.01 && Math.abs(afterOffset[10]-1)<0.01;
  log('After Z+1.2 rotation — offset is identity? ' + afterIdentity);

  if (!afterIdentity) log('✓ BONE DEFORMATION IS WORKING! Offset changed!');
  else log('✗ STILL IDENTITY — something else is wrong');

  // Render one frame to see the deformed state
  renderer.render(scene, camera);
  log('Rendered with shoulder rotation applied');
}

// Also rotate the other shoulder and set a rest pose
if (B.shoulderR) {
  const q = new THREE.Quaternion();
  q.setFromAxisAngle(new THREE.Vector3(0, 0, 1), -1.2);
  B.shoulderR.quaternion.multiply(q);
}

// Animate with breathing + blink + sway
const morphs = {};
model.traverse(n => {
  if (n.isMesh && n.morphTargetDictionary) {
    for (const [name, idx] of Object.entries(n.morphTargetDictionary)) {
      if (!morphs[name]) morphs[name] = { mesh: n, index: idx };
    }
  }
});

// Save initial quaternions
for (const b of Object.values(B)) { if (b) b._iq = b.quaternion.clone(); }

const clock = new THREE.Clock();
let t = 0, nextBlink = 2;

function animate() {
  requestAnimationFrame(animate);
  const dt = clock.getDelta(); t += dt;

  // Sway
  if (B.root) {
    const sq = new THREE.Quaternion();
    sq.setFromAxisAngle(new THREE.Vector3(0,0,1), Math.sin(t*0.4)*0.015);
    B.root.quaternion.copy(B.root._iq).multiply(sq);
  }
  // Breathe
  if (B.spine1) {
    const bq = new THREE.Quaternion();
    bq.setFromAxisAngle(new THREE.Vector3(1,0,0), Math.sin(t*0.8)*0.008);
    B.spine1.quaternion.copy(B.spine1._iq).multiply(bq);
  }
  // Head
  if (B.head) {
    const hq = new THREE.Quaternion();
    hq.setFromEuler(new THREE.Euler(Math.cos(t*0.5)*0.02, Math.sin(t*0.3)*0.04, 0));
    B.head.quaternion.copy(B.head._iq).multiply(hq);
  }
  // Blink
  if (t >= nextBlink) {
    const bp = (t - nextBlink) * 8;
    let v = bp < 0.5 ? bp*2 : bp < 1 ? (1-bp)*2 : 0;
    if (bp >= 1) { nextBlink = t + 2 + Math.random()*4; v = 0; }
    ['Eyes_Close_Down_Right','Eyes_Close_Down_Left'].forEach(name => {
      const m = morphs[name];
      if (m) m.mesh.morphTargetInfluences[m.index] = v;
    });
  }

  model.updateMatrixWorld(true);
  skel.update();
  controls.update();
  renderer.render(scene, camera);
}
animate();
log('\nAnimation running. She should be alive.');
addEventListener('resize', () => { camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth,innerHeight); });
</script>
</body>
</html>
