<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>Klukai Mixamo Test</title>
<style>body{margin:0;background:#12151E;color:#0f0;font-family:monospace;font-size:12px}
#log{position:absolute;top:10px;left:10px;z-index:10;background:rgba(0,0,0,0.7);padding:8px;pointer-events:none}</style></head>
<body>
<div id="log">Loading...</div>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.168.0/build/three.module.min.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.168.0/examples/jsm/"}}
</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const L = document.getElementById('log');
const log = m => { L.textContent += '\n' + m; };

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x12151E);
const camera = new THREE.PerspectiveCamera(30, innerWidth/innerHeight, 0.01, 100);
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
scene.add(new THREE.AmbientLight(0xffffff, 0.8));
const dl = new THREE.DirectionalLight(0xffffff, 1);
dl.position.set(2,3,2); scene.add(dl);

log('Loading model...');
const gltf = await new Promise((resolve, reject) => {
  new GLTFLoader().load('/app/assets/models/klukai_v2.glb', resolve,
    p => { if (p.total) L.textContent = 'Loading... ' + ((p.loaded/p.total)*100).toFixed(0) + '%'; },
    reject);
});
const model = gltf.scene;
scene.add(model);

const box = new THREE.Box3().setFromObject(model);
const sz = box.getSize(new THREE.Vector3());
const ct = box.getCenter(new THREE.Vector3());
model.position.set(-ct.x, -box.min.y, -ct.z);
camera.position.set(0, sz.y*0.5, sz.y*1.5);
controls.target.set(0, sz.y*0.4, 0);
controls.update();

log('Model: ' + sz.x.toFixed(2) + 'x' + sz.y.toFixed(2) + 'x' + sz.z.toFixed(2));
log('Animations: ' + gltf.animations.length);

let mixer = null;
if (gltf.animations.length > 0) {
  mixer = new THREE.AnimationMixer(model);
  const clip = gltf.animations[0];
  const action = mixer.clipAction(clip);
  action.play();
  log('Playing: ' + clip.name + ' (' + clip.duration.toFixed(1) + 's)');
} else {
  log('NO ANIMATIONS FOUND');
}

const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  if (mixer) mixer.update(clock.getDelta());
  controls.update();
  renderer.render(scene, camera);
}
animate();
log('Ready. Drag to orbit, scroll to zoom.');
addEventListener('resize', () => { camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth,innerHeight); });
</script>
</body>
</html>
