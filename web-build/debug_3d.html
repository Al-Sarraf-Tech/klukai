<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Klukai Animation Test</title>
<style>body{margin:0;background:#12151E;color:#0f0;font-family:monospace;font-size:12px}
#log{position:absolute;top:10px;left:10px;z-index:10;background:rgba(0,0,0,0.8);padding:8px;max-width:40%;white-space:pre-wrap;pointer-events:none}</style>
</head>
<body>
<div id="log">Loading...</div>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.168.0/build/three.module.min.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.168.0/examples/jsm/"}}
</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const L = document.getElementById('log');
const log = m => { L.textContent += '\n' + m; console.log(m); };

// Scene
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x12151E);
const camera = new THREE.PerspectiveCamera(30, innerWidth/innerHeight, 0.01, 100);
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
scene.add(new THREE.AmbientLight(0xffffff, 0.8));
const dl = new THREE.DirectionalLight(0xffffff, 1);
dl.position.set(2,3,2);
scene.add(dl);

// Load
log('Loading model...');
const gltf = await new Promise((resolve, reject) => {
  new GLTFLoader().load('/app/assets/models/klukai.glb', resolve,
    p => { if (p.total) L.textContent = 'Loading... ' + ((p.loaded/p.total)*100).toFixed(0) + '%'; },
    e => { log('LOAD ERROR: ' + e.message); reject(e); }
  );
});
log('gltf keys: ' + Object.keys(gltf));
log('gltf.scene: ' + gltf.scene);
log('gltf.scenes: ' + gltf.scenes);
log('gltf type: ' + typeof gltf);
if (gltf.scene) log('scene.type: ' + gltf.scene.type + ' name: ' + gltf.scene.name);
if (gltf.scenes) log('scenes count: ' + gltf.scenes.length);

const model = gltf.scene || (gltf.scenes && gltf.scenes[0]);
if (!model) { log('ERROR: no scene found in gltf!'); throw new Error('No scene'); }
log('model: ' + model.type + ' children: ' + model.children.length);

// Remove cube - safely
try {
  const toRemove = [];
  model.traverse(n => { if (n.name === 'Cube') toRemove.push(n); });
  toRemove.forEach(n => n.removeFromParent());
} catch(e) { log('traverse error: ' + e.message); }
scene.add(model);

// Center
const box = new THREE.Box3().setFromObject(model);
const sz = box.getSize(new THREE.Vector3());
const ct = box.getCenter(new THREE.Vector3());
model.position.set(-ct.x, -box.min.y, -ct.z);
camera.position.set(0, sz.y*0.5, sz.y*1.5);
controls.target.set(0, sz.y*0.45, 0);
controls.update();
log('Model loaded: ' + sz.x.toFixed(2) + 'x' + sz.y.toFixed(2));

// Find Body skeleton (673 bones, DEF- prefix)
let skel = null;
model.traverse(n => {
  if (n.isSkinnedMesh && n.name === 'Body' && n.skeleton) skel = n.skeleton;
});
if (!skel) {
  model.traverse(n => {
    if (n.isSkinnedMesh && n.skeleton && (!skel || n.skeleton.bones.length > skel.bones.length))
      skel = n.skeleton;
  });
}
log('Skeleton: ' + (skel ? skel.bones.length + ' bones' : 'NONE'));

// Find DEF- bones
const B = {};
if (skel) {
  for (const bone of skel.bones) {
    if (bone.name === 'DEF-Head_M') B.head = bone;
    if (bone.name === 'DEF-Neck_M') B.neck = bone;
    if (bone.name === 'DEF-Chest_M') B.chest = bone;
    if (bone.name === 'DEF-Spine2_M') B.spine2 = bone;
    if (bone.name === 'DEF-Spine1_M') B.spine1 = bone;
    if (bone.name === 'DEF-Root_M') B.root = bone;
  }
  log('Bones: ' + Object.entries(B).map(([k,v]) => k + '=' + v.name).join(', '));

  // Save initial state
  for (const b of Object.values(B)) {
    b._ir = b.rotation.clone();
    b._iq = b.quaternion.clone();
  }
}

// Find morphs
const morphs = {};
model.traverse(n => {
  if (n.isMesh && n.morphTargetDictionary) {
    for (const [name, idx] of Object.entries(n.morphTargetDictionary)) {
      if (!morphs[name]) morphs[name] = { mesh: n, idx };
    }
  }
});
log('Morphs: ' + Object.keys(morphs).length);

// ═══ AUTO-ANIMATE — NO BUTTONS NEEDED ═══
log('\n=== STARTING AUTO-ANIMATION ===');
log('If she moves: bones work. If she blinks: morphs work.');

const clock = new THREE.Clock();
let t = 0;
let frame = 0;
let nextBlink = 2;

function animate() {
  requestAnimationFrame(animate);
  const dt = clock.getDelta();
  t += dt;
  frame++;

  // Log first few frames to prove loop is running
  if (frame <= 3) log('Frame ' + frame + ' dt=' + dt.toFixed(3));

  // ── LARGE obvious bone movements ──
  if (B.root) {
    // Sway side to side — LARGE amplitude so it's unmissable
    B.root.rotation.z = (B.root._ir?.z || 0) + Math.sin(t * 0.5) * 0.08;
  }

  if (B.spine1) {
    // Breathing — chest rises and falls
    B.spine1.rotation.x = (B.spine1._ir?.x || 0) + Math.sin(t * 0.8) * 0.03;
  }

  if (B.head) {
    // Head looks around slowly
    B.head.rotation.y = (B.head._ir?.y || 0) + Math.sin(t * 0.3) * 0.15;
    B.head.rotation.x = (B.head._ir?.x || 0) + Math.cos(t * 0.4) * 0.05;
  }

  // ── Blink with morphs ──
  if (t >= nextBlink) {
    const blinkProgress = (t - nextBlink) * 8;
    let val = 0;
    if (blinkProgress < 0.5) val = blinkProgress * 2;
    else if (blinkProgress < 1.0) val = (1 - blinkProgress) * 2;
    else { nextBlink = t + 2 + Math.random() * 3; val = 0; }

    if (morphs['Eyes_Close_Down_Right']) {
      morphs['Eyes_Close_Down_Right'].mesh.morphTargetInfluences[morphs['Eyes_Close_Down_Right'].idx] = val;
    }
    if (morphs['Eyes_Close_Down_Left']) {
      morphs['Eyes_Close_Down_Left'].mesh.morphTargetInfluences[morphs['Eyes_Close_Down_Left'].idx] = val;
    }
  }

  // Log bone state every 2 seconds to prove values are changing
  if (frame % 120 === 0 && B.head) {
    log('t=' + t.toFixed(1) + ' head.rot.y=' + B.head.rotation.y.toFixed(4));
  }

  // CRITICAL: Force skeleton matrix update (Phase 3 proved this works)
  if (skel) skel.update();

  controls.update();
  renderer.render(scene, camera);
}

animate();

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
