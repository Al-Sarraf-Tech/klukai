# Prometheus config for klukai observability stack.
#
# Scrape targets:
#  - alloy itself (collector health)
#  - companion-core /internal/metrics (dedicated bearer-token file)
#
# Per S+ uplift spec §5.2: 15d retention, configured at runtime via
# --storage.tsdb.retention.time=15d flag.

global:
  scrape_interval: 30s
  scrape_timeout: 10s
  evaluation_interval: 30s
  external_labels:
    cluster: klukai
    host: amarillo

scrape_configs:
  - job_name: alloy
    static_configs:
      - targets:
          - klukai-alloy:12345
        labels:
          service: alloy

  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090
        labels:
          service: prometheus

  - job_name: loki
    static_configs:
      - targets:
          - klukai-loki:3100
        labels:
          service: loki

  - job_name: tempo
    static_configs:
      - targets:
          - klukai-tempo:3200
        labels:
          service: tempo

  - job_name: grafana
    static_configs:
      - targets:
          - klukai-grafana:3000
        labels:
          service: grafana

  # companion-core bounded RED/breaker metrics. Core serves them only to the
  # dedicated scrape token (fail closed: 401 without it). The token is a
  # private 0600 file outside Git, mounted read-only by docker-compose.obs.yml.
  - job_name: klukai-core
    metrics_path: /internal/metrics
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/secrets/metrics-token
    static_configs:
      - targets:
          - companion-core:8300
        labels:
          service: klukai-core

# Generated SLO recordings and alerts (python -m tools.observability.slo_assets).
# No Alertmanager is configured yet: alerts evaluate and show in Prometheus and
# Grafana but are not routed anywhere. Reload after rule changes:
#   curl -X POST http://127.0.0.1:19090/-/reload
rule_files:
  - /etc/prometheus/rules/klukai-slo.rules.yml
