<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="930" viewBox="0 0 1200 930" role="img" aria-labelledby="title desc">
<title id="title">Klukai — v1.1.0 architecture</title><desc id="desc">Sonnet is the interactive primary. The core host provides state and Intel Arc TTS; Dominus retains local fallback, image and voice services. Creative cloud providers are disabled by default, with independent request caps and no local GPU lease.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1220"/><stop offset="1" stop-color="#111827"/></linearGradient>
 <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#7dd3fc"/></marker>
</defs>
<rect width="1200" height="930" fill="url(#bg)"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="600" y="40" text-anchor="middle" fill="#e2e8f0" font-size="24" font-weight="700">Klukai — v1.1.0 architecture</text>
<text x="600" y="67" text-anchor="middle" fill="#a8b5c9" font-size="13" font-weight="400">Interactive chat, local services and optional creative providers · IP addresses omitted</text>
<rect x="40" y="95" width="1120" height="70" rx="12" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
<text x="600" y="123" text-anchor="middle" fill="#7dd3fc" font-size="14" font-weight="700">PUBLIC EDGE</text>
<text x="600" y="147" text-anchor="middle" fill="#a8b5c9" font-size="13" font-weight="400">Cloudflare TLS  →  nginx gateway  →  Flutter PWA / companion view</text>
<path d="M240,165 L240,205" fill="none" stroke="#7dd3fc" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="40" y="205" width="400" height="570" rx="16" fill="#0f2744" stroke="#38bdf8" stroke-width="1.5"/>
<text x="240" y="237" text-anchor="middle" fill="#7dd3fc" font-size="17" font-weight="700">CORE HOST</text>
<text x="240" y="258" text-anchor="middle" fill="#a8b5c9" font-size="12" font-weight="400">Application · durable state · Intel Arc voice</text>
<rect x="60" y="279" width="360" height="78" rx="12" fill="#0c1a2e" stroke="#475569" stroke-width="1.5"/>
<text x="240" y="305" text-anchor="middle" fill="#e2e8f0" font-size="15" font-weight="700">companion-core</text>
<text x="240" y="329" text-anchor="middle" fill="#a8b5c9" font-size="12" font-weight="400">FastAPI · WebSocket chat · Her POV</text>
<text x="240" y="347" text-anchor="middle" fill="#a8b5c9" font-size="12" font-weight="400">Provider routing · proactive jobs · memory</text>
<rect x="60" y="379" width="112" height="64" rx="12" fill="#0c1a2e" stroke="#475569" stroke-width="1.5"/>
<text x="116" y="405" text-anchor="middle" fill="#e2e8f0" font-size="12" font-weight="700">PostgreSQL</text>
<text x="116" y="425" text-anchor="middle" fill="#a8b5c9" font-size="10" font-weight="400">messages / jobs</text>
<rect x="184" y="379" width="112" height="64" rx="12" fill="#0c1a2e" stroke="#475569" stroke-width="1.5"/>
<text x="240" y="405" text-anchor="middle" fill="#e2e8f0" font-size="12" font-weight="700">Redis</text>
<text x="240" y="425" text-anchor="middle" fill="#a8b5c9" font-size="10" font-weight="400">events / sessions</text>
<rect x="308" y="379" width="112" height="64" rx="12" fill="#0c1a2e" stroke="#475569" stroke-width="1.5"/>
<text x="364" y="405" text-anchor="middle" fill="#e2e8f0" font-size="12" font-weight="700">Qdrant</text>
<text x="364" y="425" text-anchor="middle" fill="#a8b5c9" font-size="10" font-weight="400">memory recall</text>
<rect x="60" y="465" width="360" height="73" rx="12" fill="#0c1a2e" stroke="#34d399" stroke-width="1.5"/>
<text x="240" y="492" text-anchor="middle" fill="#a7f3d0" font-size="15" font-weight="700">Intel Arc TTS</text>
<text x="240" y="514" text-anchor="middle" fill="#a8b5c9" font-size="12" font-weight="400">Native speech service · current primary voice</text>
<rect x="60" y="560" width="360" height="78" rx="12" fill="#0c1a2e" stroke="#475569" stroke-width="1.5"/>
<text x="240" y="587" text-anchor="middle" fill="#e2e8f0" font-size="14" font-weight="700">events-bridge + RabbitMQ</text>
<text x="240" y="610" text-anchor="middle" fill="#a8b5c9" font-size="12" font-weight="400">Durable job delivery · Redis → AMQP</text>
<text x="240" y="628" text-anchor="middle" fill="#a8b5c9" font-size="11" font-weight="400">Delivery hold is separate from provider admission</text>
<rect x="60" y="660" width="360" height="58" rx="12" fill="#0c1a2e" stroke="#475569" stroke-width="1.5"/>
<text x="240" y="684" text-anchor="middle" fill="#e2e8f0" font-size="13" font-weight="700">Observability</text>
<text x="240" y="705" text-anchor="middle" fill="#a8b5c9" font-size="11" font-weight="400">Prometheus · Grafana · Loki · Tempo · Alloy</text>
<text x="240" y="750" text-anchor="middle" fill="#a8b5c9" font-size="11" font-weight="400">Chat, memory and archives are stored locally</text>
<path d="M440,317 L500,317" fill="none" stroke="#7dd3fc" stroke-width="2" marker-end="url(#arrow)"/>
<text x="470" y="303" text-anchor="middle" fill="#7dd3fc" font-size="10" font-weight="700">HTTPS</text>
<path d="M440,579 L500,579" fill="none" stroke="#7dd3fc" stroke-width="2" marker-end="url(#arrow)"/>
<text x="470" y="558" text-anchor="middle" fill="#7dd3fc" font-size="10" font-weight="700">Private</text>
<text x="470" y="572" text-anchor="middle" fill="#7dd3fc" font-size="10" font-weight="700">mesh</text>
<rect x="500" y="205" width="660" height="275" rx="16" fill="#252016" stroke="#fbbf24" stroke-width="1.5"/>
<text x="830" y="237" text-anchor="middle" fill="#fde68a" font-size="17" font-weight="700">HOSTED API PROVIDERS</text>
<rect x="520" y="257" width="620" height="76" rx="12" fill="#171713" stroke="#fbbf24" stroke-width="1.5"/>
<text x="830" y="285" text-anchor="middle" fill="#fde68a" font-size="15" font-weight="700">Interactive chat: Anthropic Sonnet 5.5</text>
<text x="830" y="309" text-anchor="middle" fill="#a8b5c9" font-size="12" font-weight="400">Primary · medium adaptive thinking · Dominus is the local fallback</text>
<rect x="520" y="352" width="620" height="106" rx="12" fill="#171713" stroke="#fbbf24" stroke-width="1.5" stroke-dasharray="7 5"/>
<text x="830" y="379" text-anchor="middle" fill="#fde68a" font-size="15" font-weight="700">Creative cloud providers — OFF by default</text>
<text x="830" y="402" text-anchor="middle" fill="#a8b5c9" font-size="12" font-weight="400">Sonnet: dreams / scene text     ·     OpenAI Images: scenes / pictures</text>
<text x="830" y="425" text-anchor="middle" fill="#a8b5c9" font-size="12" font-weight="400">Separate opt-ins, keys and positive daily + monthly attempt caps</text>
<text x="830" y="446" text-anchor="middle" fill="#a8b5c9" font-size="12" font-weight="400">Cloud images also require a configured local character reference pack</text>
<rect x="500" y="510" width="660" height="265" rx="16" fill="#24142f" stroke="#c084fc" stroke-width="1.5"/>
<text x="830" y="542" text-anchor="middle" fill="#d8b4fe" font-size="17" font-weight="700">LOCAL GPU HOST · DOMINUS</text>
<text x="830" y="562" text-anchor="middle" fill="#a8b5c9" font-size="12" font-weight="400">RTX 3090 · private mesh endpoints · gaming / idle guards</text>
<rect x="520" y="584" width="300" height="78" rx="12" fill="#180f23" stroke="#a78bfa" stroke-width="1.5"/>
<text x="670" y="612" text-anchor="middle" fill="#d8b4fe" font-size="14" font-weight="700">Local language model</text>
<text x="670" y="635" text-anchor="middle" fill="#a8b5c9" font-size="11" font-weight="400">Interactive fallback · default creative text</text>
<text x="670" y="652" text-anchor="middle" fill="#a8b5c9" font-size="11" font-weight="400">Gateway / llama-router</text>
<rect x="840" y="584" width="300" height="78" rx="12" fill="#180f23" stroke="#a78bfa" stroke-width="1.5"/>
<text x="990" y="612" text-anchor="middle" fill="#d8b4fe" font-size="14" font-weight="700">ComfyUI</text>
<text x="990" y="635" text-anchor="middle" fill="#a8b5c9" font-size="12" font-weight="400">Default scene-image provider</text>
<text x="990" y="652" text-anchor="middle" fill="#a8b5c9" font-size="11" font-weight="400">Portrait / inpaint / img2img stay local</text>
<rect x="520" y="682" width="620" height="51" rx="12" fill="#180f23" stroke="#475569" stroke-width="1.5"/>
<text x="830" y="713" text-anchor="middle" fill="#a8b5c9" font-size="12" font-weight="400">Retained local voice services: XTTS synthesis · speech recognition</text>
<text x="830" y="753" text-anchor="middle" fill="#d8b4fe" font-size="12" font-weight="400">GPU work uses the existing gate, leases and bounded execution</text>
<rect x="40" y="805" width="1120" height="98" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
<text x="62" y="832" text-anchor="start" fill="#e2e8f0" font-size="13" font-weight="700">REQUEST ADMISSION</text>
<text x="62" y="855" text-anchor="start" fill="#a8b5c9" font-size="12" font-weight="400">Local GPU work: existing gate / lease controls.  Cloud images: one request at a time per core process; no GPU lease.</text>
<text x="62" y="878" text-anchor="start" fill="#a8b5c9" font-size="12" font-weight="400">Cloud creatives reserve an attempt before dispatch; failures and uncertain timeouts count. Caps are request limits, not dollar budgets.</text>
</g></svg>
