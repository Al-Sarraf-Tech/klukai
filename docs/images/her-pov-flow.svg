<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="690" viewBox="0 0 1200 690" role="img" aria-labelledby="title desc">
<title id="title">Her POV — durable jobs and provider admission</title><desc id="desc">Her POV persists jobs before durable queue delivery. Text and image providers are selected independently. Local providers retain GPU admission controls; opt-in cloud requests use persistent attempt caps and cloud images use a separate single-flight lock.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1220"/><stop offset="1" stop-color="#111827"/></linearGradient>
 <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#7dd3fc"/></marker>
</defs>
<rect width="1200" height="690" fill="url(#bg)"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="600" y="40" text-anchor="middle" fill="#e2e8f0" font-size="23" font-weight="700">Her POV — durable jobs and provider admission</text>
<text x="600" y="66" text-anchor="middle" fill="#a8b5c9" font-size="13" font-weight="400">PostgreSQL holds job state · the queue carries an ID · provider selection is independent of delivery</text>
<rect x="40" y="105" width="170" height="108" rx="12" fill="#0f2744" stroke="#7dd3fc" stroke-width="1.5"/>
<text x="125" y="137" text-anchor="middle" fill="#7dd3fc" font-size="14" font-weight="700">1. Request</text>
<text x="125" y="166" text-anchor="middle" fill="#a8b5c9" font-size="12" font-weight="400">Open Her POV</text>
<text x="125" y="188" text-anchor="middle" fill="#a8b5c9" font-size="12" font-weight="400">Choose a memory</text>
<path d="M210,159 L230,159" fill="none" stroke="#7dd3fc" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="230" y="105" width="170" height="108" rx="12" fill="#0f2744" stroke="#7dd3fc" stroke-width="1.5"/>
<text x="315" y="137" text-anchor="middle" fill="#7dd3fc" font-size="14" font-weight="700">2. Persist</text>
<text x="315" y="166" text-anchor="middle" fill="#a8b5c9" font-size="12" font-weight="400">Create job row</text>
<text x="315" y="188" text-anchor="middle" fill="#a8b5c9" font-size="12" font-weight="400">status = queued</text>
<path d="M400,159 L420,159" fill="none" stroke="#7dd3fc" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="420" y="105" width="170" height="108" rx="12" fill="#24142f" stroke="#d8b4fe" stroke-width="1.5"/>
<text x="505" y="137" text-anchor="middle" fill="#d8b4fe" font-size="14" font-weight="700">3. Enqueue</text>
<text x="505" y="166" text-anchor="middle" fill="#a8b5c9" font-size="12" font-weight="400">Redis event → bridge</text>
<text x="505" y="188" text-anchor="middle" fill="#a8b5c9" font-size="12" font-weight="400">RabbitMQ delivery</text>
<path d="M590,159 L610,159" fill="none" stroke="#7dd3fc" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="610" y="105" width="170" height="108" rx="12" fill="#24142f" stroke="#d8b4fe" stroke-width="1.5"/>
<text x="695" y="137" text-anchor="middle" fill="#d8b4fe" font-size="14" font-weight="700">4. Hold</text>
<text x="695" y="166" text-anchor="middle" fill="#a8b5c9" font-size="12" font-weight="400">Bridge holds delivery</text>
<text x="695" y="188" text-anchor="middle" fill="#a8b5c9" font-size="12" font-weight="400">until completion</text>
<path d="M780,159 L800,159" fill="none" stroke="#7dd3fc" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="800" y="105" width="170" height="108" rx="12" fill="#0f2744" stroke="#a7f3d0" stroke-width="1.5"/>
<text x="885" y="137" text-anchor="middle" fill="#a7f3d0" font-size="14" font-weight="700">5. Pipeline</text>
<text x="885" y="166" text-anchor="middle" fill="#a8b5c9" font-size="12" font-weight="400">Search → compose</text>
<text x="885" y="188" text-anchor="middle" fill="#a8b5c9" font-size="12" font-weight="400">Draw → keep</text>
<path d="M970,159 L990,159" fill="none" stroke="#7dd3fc" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="990" y="105" width="170" height="108" rx="12" fill="#0f2744" stroke="#fde68a" stroke-width="1.5"/>
<text x="1075" y="137" text-anchor="middle" fill="#fde68a" font-size="14" font-weight="700">6. Archive</text>
<text x="1075" y="166" text-anchor="middle" fill="#a8b5c9" font-size="12" font-weight="400">Memory + image</text>
<text x="1075" y="188" text-anchor="middle" fill="#a8b5c9" font-size="12" font-weight="400">Tag: her_pov</text>
<path d="M885,213 L885,243" fill="none" stroke="#7dd3fc" stroke-width="2" marker-end="url(#arrow)"/>
<text x="600" y="267" text-anchor="middle" fill="#e2e8f0" font-size="15" font-weight="700">Composition and drawing choose providers separately</text>
<rect x="40" y="292" width="548" height="208" rx="14" fill="#24142f" stroke="#c084fc" stroke-width="1.5"/>
<text x="314" y="326" text-anchor="middle" fill="#d8b4fe" font-size="16" font-weight="700">LOCAL PROVIDERS · DEFAULT</text>
<text x="314" y="355" text-anchor="middle" fill="#a8b5c9" font-size="13" font-weight="400">Local language model for scene text</text>
<text x="314" y="379" text-anchor="middle" fill="#a8b5c9" font-size="13" font-weight="400">ComfyUI for images</text>
<text x="314" y="414" text-anchor="middle" fill="#d8b4fe" font-size="13" font-weight="400">Existing GPU gate, leases and gaming / idle guards</text>
<text x="314" y="440" text-anchor="middle" fill="#a8b5c9" font-size="12" font-weight="400">Local render concurrency and execution limits remain</text>
<text x="314" y="478" text-anchor="middle" fill="#a8b5c9" font-size="12" font-weight="400">Portrait, inpainting and img2img remain local</text>
<rect x="612" y="292" width="548" height="208" rx="14" fill="#252016" stroke="#fbbf24" stroke-width="1.5" stroke-dasharray="7 5"/>
<text x="886" y="326" text-anchor="middle" fill="#fde68a" font-size="15" font-weight="700">CLOUD PROVIDERS · OPT-IN / DEFAULT OFF</text>
<text x="886" y="355" text-anchor="middle" fill="#a8b5c9" font-size="13" font-weight="400">Sonnet scene text · OpenAI scene images</text>
<text x="886" y="379" text-anchor="middle" fill="#a8b5c9" font-size="13" font-weight="400">Separate keys + daily / monthly attempt caps</text>
<text x="886" y="414" text-anchor="middle" fill="#fde68a" font-size="13" font-weight="400">Reserve in persistent ledger before API dispatch</text>
<text x="886" y="440" text-anchor="middle" fill="#a8b5c9" font-size="12" font-weight="400">Images: reference pack + one active request per process</text>
<text x="886" y="478" text-anchor="middle" fill="#a8b5c9" font-size="12" font-weight="400">Bounded waits and requests · no local GPU lease</text>
<rect x="40" y="526" width="1120" height="136" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
<text x="62" y="554" text-anchor="start" fill="#e2e8f0" font-size="13" font-weight="700">DURABILITY AND FAILURE BEHAVIOR</text>
<text x="62" y="581" text-anchor="start" fill="#a8b5c9" font-size="12" font-weight="400">One active job per user prevents duplicate active work. Browser disconnects leave durable job progress in PostgreSQL.</text>
<text x="62" y="607" text-anchor="start" fill="#a8b5c9" font-size="12" font-weight="400">Cloud failures and uncertain timeouts consume attempts; no automatic API retry or provider hopping. Zero caps deny dispatch.</text>
<text x="62" y="633" text-anchor="start" fill="#a8b5c9" font-size="12" font-weight="400">Cloud work already thinking or drawing is not automatically reclaimed after a crash; unresolved outcomes require review.</text>
</g></svg>
