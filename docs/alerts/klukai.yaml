- name: klukai_slo_alerts
  interval: 30s
  rules:
  - alert: KlukaiSLOBudgetBurn
    expr: (klukai:slo_burn_rate:5m{method="GET",route="/health"} > 1) and on (route, method) (klukai:slo_burn_rate:1h{method="GET",route="/health"} > 1) and on (route,
      method) (klukai:slo_requests:5m{method="GET",route="/health"} >= 20) and on (route, method) (klukai:slo_requests:1h{method="GET",route="/health"} >= 20)
    for: 30s
    labels:
      severity: page
      route: /health
      method: GET
    annotations:
      summary: GET /health burn_rate objective exceeded
      description: Both 5m, 1h windows exceed the objective with at least 20 requests each. Availability 99.90000%; p99 30 ms. Missing samples never count as healthy.
      runbook_url: https://github.com/Al-Sarraf-Tech/klukai/blob/main/docs/runbooks/dependency-outage.md#availability-burn
  - alert: KlukaiSLOLatency
    expr: (klukai:slo_p99_ms:5m{method="GET",route="/health"} > 30) and on (route, method) (klukai:slo_p99_ms:1h{method="GET",route="/health"} > 30) and on (route,
      method) (klukai:slo_requests:5m{method="GET",route="/health"} >= 20) and on (route, method) (klukai:slo_requests:1h{method="GET",route="/health"} >= 20)
