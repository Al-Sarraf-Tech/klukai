name: Klukai Nightly

# S+ Phase 3-4 hygiene (per docs/superpowers/specs/2026-05-16-s-plus-uplift.md §8.2, §8.5).
#
# Jobs:
#   1. mutation-test    — mutmut 3.x on character-critical paths (config in
#                         docker/core/setup.cfg); kill-rate ratchet gate
#   2. perf-nightly     — paired disposable p99 run of main vs its previous commit;
#                         summary retained on the heavy guest, pulled into Grafana
#                         by ops/amarillo/scripts/klukai-fetch-ci-artifacts.py
#   3. trivy-deep       — full HIGH+CRITICAL fs scan, BLOCKING (installs trivy
#                         to a writable dir if missing — fs scan needs no Docker)
#
# History: this workflow failed every night from 2026-05-29 to 2026-06-11 and
# was never green. Root causes fixed 2026-06-11: pip-installed mutmut wasn't on
# PATH (exit 127 hidden by continue-on-error), the gate parsed a `mutmut json`
# subcommand that doesn't exist, mutmut 2.x can't run on modern Python, and the
# 80% kill-rate bar was aspiration (measured baseline ~48%). The gate is now a
# RATCHET against the measured baseline — raise MIN_KILL_RATE as tests improve,
# never lower it to silence a red night.

on:
  schedule:
    # 01:37 UTC = 20:37 CDT / 19:37 CST, well before the 23:30 nightly hard
    # stop. If Dominus is off, GitHub keeps the jobs queued until it boots; each
    # job's window guard then refuses to start if it could not finish in time.
    - cron: '37 1 * * *'
  workflow_dispatch:

permissions:
  contents: read

env:
  KLUKAI_NIGHTLY_ROOT: /opt/klukai-ci/artifacts/nightly

jobs:
  mutation:
    name: Mutation test (mutmut)
    runs-on: [self-hosted, Linux, X64, ci-heavy]
    timeout-minutes: 120
    defaults:
      run:
        working-directory: docker/core
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/nightly-window
        with:
          latest-start: "2115"   # up to 120 minutes

      - name: Install deps into a venv (PATH-safe)
        run: |
          python3 -m venv "${RUNNER_TEMP}/mutenv"
          . "${RUNNER_TEMP}/mutenv/bin/activate"
          python3 -m pip install --upgrade pip
          pip install -r requirements.txt
          # mutmut pinned to the locally-validated version: 3.5.0 and older
          # don't understand the source_paths key in setup.cfg
          pip install pytest pytest-asyncio pytest-cov "mutmut==3.6.0"
          # fail HERE, loudly, if the install is broken ('mutmut version' is
          # not a stable CLI command across 3.x — check the import instead)
          command -v mutmut
          python3 -c "import importlib.metadata as m; print('mutmut', m.version('mutmut'))"

      - name: Run mutmut on character-critical paths
        # Config lives in docker/core/setup.cfg [mutmut]; PERSONALITY_PATH must
        # be absolute because mutmut executes tests from its mutants/ copy.
        run: |
          . "${RUNNER_TEMP}/mutenv/bin/activate"
          export PERSONALITY_PATH="${GITHUB_WORKSPACE}/config/personality.yaml"
          # --max-children 2: the python-slim runner is a 3-CPU/4GB container
          # on amarillo (70C thermal ceiling); an uncapped run (one pytest
          # worker per CPU) killed the runner with exit 137 on 2026-06-12.
          mutmut run --max-children 2 || true   # gate on parsed results, not exit code
          mutmut results --all true > /tmp/mutmut-results.txt
          grep -oE ': [a-z ]+$' /tmp/mutmut-results.txt | sort | uniq -c

      - name: Enforce kill-rate ratchet gate
        # Measured 2026-06-12: 804 killed / 1198 = 67.11%, 0 uncovered. (The
        # earlier 50.18% was an artifact — affection's fixture tests were
        # skipping in the mutmut sandbox because conftest's personality_config_path
        # ignored PERSONALITY_PATH; fixed, so the real rate surfaced.)
        # The remaining ~394 survivors are overwhelmingly string-literal mutants
        # (prompt/log wording, deliberately not pinned) plus documented
        # equivalent mutants. Ratchet: raise as kill rate improves, never lower.
        #
        # Floor 67 sits ~1 mutant under the measured 67.11% (804/1198): losing a
        # single killed mutant (803/1198 = 67.03%) still passes; losing two
        # (66.94%) goes red. This is intentionally the strictest possible ratchet
        # — effectively "any new logic regression in these modules fails nightly."
        # If it ever flakes from equivalent-mutant churn, drop to 66, never lower
        # the work; kill the mutant instead.
        env:
          MIN_KILL_RATE: "67"
        run: |
          . "${RUNNER_TEMP}/mutenv/bin/activate"
          python3 - <<'PY'
          import os, re, sys
          text = open("/tmp/mutmut-results.txt").read()
          counts = {}
          for status in re.findall(r":\s*(\w[\w ]*\w)\s*$", text, re.M):
              counts[status] = counts.get(status, 0) + 1
          killed = counts.get("killed", 0) + counts.get("timeout", 0)
          survived = counts.get("survived", 0) + counts.get("suspicious", 0)
          checked = killed + survived
          print(f"mutmut status counts: {counts}")
          if checked == 0:
              print("FAIL: no mutants were checked — mutation run is broken")
              sys.exit(1)
          rate = killed * 100.0 / checked
          floor = float(os.environ["MIN_KILL_RATE"])
          print(f"Mutation kill rate: {rate:.2f}% ({killed}/{checked} checked; "
                f"{counts.get('no tests', 0)} uncovered)")
          summary = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary:
              with open(summary, "a") as f:
                  f.write(f"### Mutation kill rate: {rate:.2f}% "
                          f"({killed}/{checked}, floor {floor}%)\n")
          sys.exit(0 if rate >= floor else 1)
          PY

      - name: Retain mutation results on the heavy guest (no GitHub storage)
        if: always()
        run: |
          out="${KLUKAI_NIGHTLY_ROOT}/mutation/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          install -d -m 0700 "$out"
          cp /tmp/mutmut-results.txt "$out/" 2>/dev/null || echo "no mutation results to retain"

  perf-nightly:
    name: Nightly paired performance (retained)
    runs-on: [self-hosted, Linux, X64, ci-heavy]
    timeout-minutes: 45
    env:
      KLUKAI_CI_NATIVE_SANDBOX: unavailable
      KLUKAI_PERF_POSTGRES_IMAGE: postgres@sha256:6f30057d31f5861b66f3545d4821f987aacf1dd920765f0acadea0c58ff975b1
      KLUKAI_PERF_REDIS_IMAGE: valkey/valkey@sha256:cb3339abbd6e18942cd8ac3349f0c371a82ba5b6204b242563ba299e7956cbd0
      KLUKAI_PERF_QDRANT_IMAGE: qdrant/qdrant@sha256:f1c7272cdac52b38c1a0e89313922d940ba50afd90d593a1605dbbc214e66ffb
      KLUKAI_PERF_FIXTURE_IMAGE: python@sha256:dc1546eefcbe8caaa1f004f16ab76b204b5e1dbd58ff81b899f21cd40541232f
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}   # main on the schedule; the branch head when dispatched
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/nightly-window
        with:
          latest-start: "2245"   # about 15 minutes of measurement
      - uses: ./.github/actions/python-tools
        env:
          KLUKAI_CI_OUTPUT: ${{ runner.temp }}/klukai-python-tools/nightly-${{ github.run_id }}-${{ github.run_attempt }}
          KLUKAI_CI_REVISION: ${{ github.sha }}
      - name: Measure main against its previous commit and retain the summary
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          head=$(git rev-parse HEAD)
          base=$(git rev-parse HEAD^1)
          stamp=$(date -u +%Y-%m-%dT%H-%MZ)
          dir="${KLUKAI_NIGHTLY_ROOT}/${stamp}-${head:0:7}"
          install -d -m 0700 "$dir"
          for image in "$KLUKAI_PERF_POSTGRES_IMAGE" "$KLUKAI_PERF_REDIS_IMAGE" \
                       "$KLUKAI_PERF_QDRANT_IMAGE" "$KLUKAI_PERF_FIXTURE_IMAGE"; do
            docker pull --quiet "$image" >/dev/null
          done
          docker build --quiet --build-arg VCS_REF="$head" \
            --label org.opencontainers.image.revision="$head" \
            -t "klukai-core:nightly-candidate-$GITHUB_RUN_ID" docker/core >/dev/null
          git archive --format=tar "$base:docker/core" | docker build --quiet \
            --build-arg VCS_REF="$base" --label org.opencontainers.image.revision="$base" \
            -t "klukai-core:nightly-baseline-$GITHUB_RUN_ID" - >/dev/null
          status=0
          python -B -m tools.ci.perf_stack \
            --baseline-image "$(docker image inspect -f '{{.Id}}' "klukai-core:nightly-baseline-$GITHUB_RUN_ID")" \
            --candidate-image "$(docker image inspect -f '{{.Id}}' "klukai-core:nightly-candidate-$GITHUB_RUN_ID")" \
            --baseline-revision "$base" --candidate-revision "$head" \
            --out "$dir/evidence" || status=$?
          python -B -m tools.ci.perf_nightly --evidence "$dir/evidence" --output "$dir/summary.json"
          # Bound the guest disk: raw evidence bundles (~180 MB a night) older than
          # 14 days go; each night's small summary.json stays.
          find "$KLUKAI_NIGHTLY_ROOT" -mindepth 2 -maxdepth 2 -type d -name evidence \
            -mtime +14 -prune -print -exec rm -rf {} +
          find "$KLUKAI_NIGHTLY_ROOT/mutation" "$KLUKAI_NIGHTLY_ROOT/trivy" -mindepth 1 \
            -maxdepth 1 -type d -mtime +30 -prune -print -exec rm -rf {} + 2>/dev/null || true
          docker image rm "klukai-core:nightly-candidate-$GITHUB_RUN_ID" \
            "klukai-core:nightly-baseline-$GITHUB_RUN_ID" >/dev/null 2>&1 || true
          exit "$status"

  trivy-deep:
    name: Trivy deep scan
    runs-on: [self-hosted, Linux, X64, ci-heavy]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/nightly-window
        with:
          latest-start: "2300"

      - name: Install trivy if missing (fs scan needs no Docker)
        # The upstream install.sh needs tooling this slim runner lacks, so
        # download the pinned release tarball and verify its sha256 in python.
        run: |
          BIN="${RUNNER_TEMP}/bin"; mkdir -p "$BIN"
          if ! command -v trivy >/dev/null 2>&1 && [[ ! -x "$BIN/trivy" ]]; then
            V=0.71.0
            curl -sfL -o /tmp/trivy.tgz \
              "https://github.com/aquasecurity/trivy/releases/download/v${V}/trivy_${V}_Linux-64bit.tar.gz"
            curl -sfL -o /tmp/trivy.sums \
              "https://github.com/aquasecurity/trivy/releases/download/v${V}/trivy_${V}_checksums.txt"
            python3 - <<'PY'
          import hashlib, sys, tarfile
          want = None
          for line in open("/tmp/trivy.sums"):
              if line.strip().endswith("trivy_0.71.0_Linux-64bit.tar.gz"):
                  want = line.split()[0]
          got = hashlib.sha256(open("/tmp/trivy.tgz", "rb").read()).hexdigest()
          if want is None or got != want:
              sys.exit(f"trivy checksum mismatch: want={want} got={got}")
          with tarfile.open("/tmp/trivy.tgz") as t:
              t.extract("trivy", path="/tmp/trivy-bin", filter="data")
          PY
            install -m 0755 /tmp/trivy-bin/trivy "$BIN/trivy"
          fi
          export PATH="$BIN:$PATH"
          trivy --version

      - name: Trivy filesystem scan (HIGH+CRITICAL BLOCKING)
        run: |
          export PATH="${RUNNER_TEMP}/bin:$PATH"
          trivy fs --severity HIGH,CRITICAL --exit-code 1 --ignore-unfixed \
            --format json --output /tmp/trivy-deep.json .
          # report-only pass for the full severity picture
          trivy fs --severity MEDIUM,HIGH,CRITICAL --exit-code 0 --quiet . || true

      - name: Retain trivy results on the heavy guest (no GitHub storage)
        if: always()
        run: |
          out="${KLUKAI_NIGHTLY_ROOT}/trivy/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          install -d -m 0700 "$out"
          cp /tmp/trivy-deep.json "$out/" 2>/dev/null || echo "no trivy results to retain"
