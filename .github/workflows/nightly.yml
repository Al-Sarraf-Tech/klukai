name: Klukai Nightly

# S+ Phase 3-4 hygiene (per docs/superpowers/specs/2026-05-16-s-plus-uplift.md §8.2, §8.5).
#
# Jobs:
#   1. mutation-test    — mutmut 3.x on character-critical paths (config in
#                         docker/core/setup.cfg); kill-rate ratchet gate
#   2. perf-baseline    — captures latency snapshot; compares via perf_compare.py
#   3. trivy-deep       — full HIGH+CRITICAL fs scan, BLOCKING (installs trivy
#                         to a writable dir if missing — fs scan needs no Docker)
#
# History: this workflow failed every night from 2026-05-29 to 2026-06-11 and
# was never green. Root causes fixed 2026-06-11: pip-installed mutmut wasn't on
# PATH (exit 127 hidden by continue-on-error), the gate parsed a `mutmut json`
# subcommand that doesn't exist, mutmut 2.x can't run on modern Python, and the
# 80% kill-rate bar was aspiration (measured baseline ~48%). The gate is now a
# RATCHET against the measured baseline — raise MIN_KILL_RATE as tests improve,
# never lower it to silence a red night.

on:
  schedule:
    - cron: '7 4 * * *'   # 04:07 UTC, off the :00 mark per CronCreate guidance
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  mutation:
    name: Mutation test (mutmut)
    runs-on: [self-hosted, python-slim]
    timeout-minutes: 120
    defaults:
      run:
        working-directory: docker/core
    steps:
      - uses: actions/checkout@v4

      - name: Install deps into a venv (PATH-safe)
        run: |
          python3 -m venv "${RUNNER_TEMP}/mutenv"
          . "${RUNNER_TEMP}/mutenv/bin/activate"
          python3 -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-cov mutmut
          # fail HERE, loudly, if the install is broken ('mutmut version' is
          # not a stable CLI command across 3.x — check the import instead)
          command -v mutmut
          python3 -c "import importlib.metadata as m; print('mutmut', m.version('mutmut'))"

      - name: Run mutmut on character-critical paths
        # Config lives in docker/core/setup.cfg [mutmut]; PERSONALITY_PATH must
        # be absolute because mutmut executes tests from its mutants/ copy.
        run: |
          . "${RUNNER_TEMP}/mutenv/bin/activate"
          export PERSONALITY_PATH="${GITHUB_WORKSPACE}/config/personality.yaml"
          mutmut run || true   # gate on parsed results, not exit code
          mutmut results --all true > /tmp/mutmut-results.txt
          grep -oE ': [a-z ]+$' /tmp/mutmut-results.txt | sort | uniq -c

      - name: Enforce kill-rate ratchet gate
        # Measured baseline 2026-06-12 (local, full suite): 417 killed / 831
        # checked = 50.2%. Ratchet: raise as kill rate improves, never lower.
        env:
          MIN_KILL_RATE: "45"
        run: |
          . "${RUNNER_TEMP}/mutenv/bin/activate"
          python3 - <<'PY'
          import os, re, sys
          text = open("/tmp/mutmut-results.txt").read()
          counts = {}
          for status in re.findall(r":\s*(\w[\w ]*\w)\s*$", text, re.M):
              counts[status] = counts.get(status, 0) + 1
          killed = counts.get("killed", 0) + counts.get("timeout", 0)
          survived = counts.get("survived", 0) + counts.get("suspicious", 0)
          checked = killed + survived
          print(f"mutmut status counts: {counts}")
          if checked == 0:
              print("FAIL: no mutants were checked — mutation run is broken")
              sys.exit(1)
          rate = killed * 100.0 / checked
          floor = float(os.environ["MIN_KILL_RATE"])
          print(f"Mutation kill rate: {rate:.2f}% ({killed}/{checked} checked; "
                f"{counts.get('no tests', 0)} uncovered)")
          summary = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary:
              with open(summary, "a") as f:
                  f.write(f"### Mutation kill rate: {rate:.2f}% "
                          f"({killed}/{checked}, floor {floor}%)\n")
          sys.exit(0 if rate >= floor else 1)
          PY

      - name: Upload mutation results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-results-${{ github.run_number }}
          path: /tmp/mutmut-results.txt
          if-no-files-found: warn

  perf-baseline:
    name: Perf baseline capture
    runs-on: [self-hosted, python-slim]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Run probe against live stack
        run: |
          if curl -sf -m 3 http://localhost:8300/health >/dev/null 2>&1; then
            python3 tools/load-test/probe.py \
              --base http://localhost:8300 \
              --requests 500 \
              --concurrency 10 \
              --out /tmp/perf-current.json
          else
            echo "::warning title=Perf capture skipped::klukai-core not reachable from this runner — no live perf data captured tonight."
          fi

      - name: Compare to committed baseline (p99 gate)
        run: |
          if [[ ! -f /tmp/perf-current.json ]]; then
            echo "::warning title=Perf gate skipped::no current snapshot (stack unreachable)."
            exit 0
          fi
          python3 tools/load-test/perf_compare.py \
            docs/perf-baseline.json /tmp/perf-current.json --threshold 1.20 \
            | tee /tmp/perf-drift.txt

      - name: Upload perf artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-nightly-${{ github.run_number }}
          path: |
            /tmp/perf-current.json
            /tmp/perf-drift.txt
          if-no-files-found: ignore

  trivy-deep:
    name: Trivy deep scan
    runs-on: [self-hosted, python-slim]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install trivy if missing (fs scan needs no Docker)
        # The upstream install.sh needs tooling this slim runner lacks, so
        # download the pinned release tarball and verify its sha256 in python.
        run: |
          BIN="${RUNNER_TEMP}/bin"; mkdir -p "$BIN"
          if ! command -v trivy >/dev/null 2>&1 && [[ ! -x "$BIN/trivy" ]]; then
            V=0.71.0
            curl -sfL -o /tmp/trivy.tgz \
              "https://github.com/aquasecurity/trivy/releases/download/v${V}/trivy_${V}_Linux-64bit.tar.gz"
            curl -sfL -o /tmp/trivy.sums \
              "https://github.com/aquasecurity/trivy/releases/download/v${V}/trivy_${V}_checksums.txt"
            python3 - <<'PY'
          import hashlib, sys, tarfile
          want = None
          for line in open("/tmp/trivy.sums"):
              if line.strip().endswith("trivy_0.71.0_Linux-64bit.tar.gz"):
                  want = line.split()[0]
          got = hashlib.sha256(open("/tmp/trivy.tgz", "rb").read()).hexdigest()
          if want is None or got != want:
              sys.exit(f"trivy checksum mismatch: want={want} got={got}")
          with tarfile.open("/tmp/trivy.tgz") as t:
              t.extract("trivy", path="/tmp/trivy-bin", filter="data")
          PY
            install -m 0755 /tmp/trivy-bin/trivy "$BIN/trivy"
          fi
          export PATH="$BIN:$PATH"
          trivy --version

      - name: Trivy filesystem scan (HIGH+CRITICAL BLOCKING)
        run: |
          export PATH="${RUNNER_TEMP}/bin:$PATH"
          trivy fs --severity HIGH,CRITICAL --exit-code 1 --ignore-unfixed \
            --format json --output /tmp/trivy-deep.json .
          # report-only pass for the full severity picture
          trivy fs --severity MEDIUM,HIGH,CRITICAL --exit-code 0 --quiet . || true

      - name: Upload trivy results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-nightly-${{ github.run_number }}
          path: /tmp/trivy-deep.json
          if-no-files-found: ignore
