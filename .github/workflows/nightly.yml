name: Klukai Nightly

# Jobs run one after another on the single heavy runner, short ones first:
#   1. perf-nightly  — paired disposable p99 run of main vs its previous commit;
#                      summary retained on the heavy guest, pulled into Grafana
#                      by ops/amarillo/scripts/klukai-fetch-ci-artifacts.py
#   2. trivy-deep    — full HIGH+CRITICAL fs scan, BLOCKING
#   3. onboarding    — docs/onboarding.md §2-§4 from a clean clone against
#                      throwaway infrastructure (tools/ci/onboarding_drill.py)
#   4. mutation      — source-bound mutmut run on the affection, audit-chain and
#                      speech critical paths via tools.ci.mutation (raw per-mutant
#                      evidence, >=80% killed, errors/timeouts/no-tests count as
#                      failure); evidence retained on the heavy guest
#
# Every job's window guard refuses to start unless it can finish before the
# 23:30 America/Chicago hard stop (Dominus is off by 23:45).

on:
  schedule:
    # 00:37 UTC = 19:37 CDT / 18:37 CST. The whole chain (perf ~20 min, trivy
    # ~5 min, mutation up to 150 min) then ends near 22:30 CDT, before the 23:30
    # hard stop. If Dominus is off, the jobs wait in the queue and each window
    # guard refuses to start one that could not finish in time.
    - cron: '37 0 * * *'
  workflow_dispatch:
    inputs:
      only:
        description: Run just one job (all runs the full chain)
        type: choice
        options: [all, perf, trivy, onboarding, mutation]
        default: all

permissions:
  contents: read

env:
  KLUKAI_NIGHTLY_ROOT: /opt/klukai-ci/artifacts/nightly

jobs:
  perf-nightly:
    name: Nightly paired performance (retained)
    if: ${{ github.event_name != 'workflow_dispatch' || contains(fromJSON('["all","perf"]'), inputs.only) }}
    runs-on: [self-hosted, Linux, X64, ci-heavy]
    timeout-minutes: 45
    env:
      KLUKAI_CI_NATIVE_SANDBOX: unavailable
      KLUKAI_PERF_POSTGRES_IMAGE: postgres@sha256:6f30057d31f5861b66f3545d4821f987aacf1dd920765f0acadea0c58ff975b1
      KLUKAI_PERF_REDIS_IMAGE: valkey/valkey@sha256:cb3339abbd6e18942cd8ac3349f0c371a82ba5b6204b242563ba299e7956cbd0
      KLUKAI_PERF_QDRANT_IMAGE: qdrant/qdrant@sha256:f1c7272cdac52b38c1a0e89313922d940ba50afd90d593a1605dbbc214e66ffb
      KLUKAI_PERF_FIXTURE_IMAGE: python@sha256:dc1546eefcbe8caaa1f004f16ab76b204b5e1dbd58ff81b899f21cd40541232f
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}   # main on the schedule; the branch head when dispatched
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/nightly-window
        with:
          latest-start: "2245"   # about 15 minutes of measurement
      - uses: ./.github/actions/python-tools
        env:
          KLUKAI_CI_OUTPUT: ${{ runner.temp }}/klukai-python-tools/nightly-${{ github.run_id }}-${{ github.run_attempt }}
          KLUKAI_CI_REVISION: ${{ github.sha }}
      - name: Measure main against its previous commit and retain the summary
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          head=$(git rev-parse HEAD)
          base=$(git rev-parse HEAD^1)
          stamp=$(date -u +%Y-%m-%dT%H-%MZ)
          dir="${KLUKAI_NIGHTLY_ROOT}/${stamp}-${head:0:7}"
          install -d -m 0700 "$dir"
          summarize() {
            # The revision comes from the workflow, so a night that died before
            # writing any evidence is still recorded as failed.
            python -B -m tools.ci.perf_nightly --evidence "$dir/evidence" \
              --output "$dir/summary.json" --revision "$head"
          }
          cleanup() {
            [ -e "$dir/summary.json" ] || summarize || true
            docker image rm "klukai-core:nightly-candidate-$GITHUB_RUN_ID" \
              "klukai-core:nightly-baseline-$GITHUB_RUN_ID" >/dev/null 2>&1 || true
          }
          # Whatever fails below (a pull, a build, the harness), the night is
          # summarized and the images go.
          trap cleanup EXIT
          for image in "$KLUKAI_PERF_POSTGRES_IMAGE" "$KLUKAI_PERF_REDIS_IMAGE" \
                       "$KLUKAI_PERF_QDRANT_IMAGE" "$KLUKAI_PERF_FIXTURE_IMAGE"; do
            docker pull --quiet "$image" >/dev/null
          done
          docker build --quiet --build-arg VCS_REF="$head" \
            --label org.opencontainers.image.revision="$head" \
            -t "klukai-core:nightly-candidate-$GITHUB_RUN_ID" docker/core >/dev/null
          git archive --format=tar "$base:docker/core" | docker build --quiet \
            --build-arg VCS_REF="$base" --label org.opencontainers.image.revision="$base" \
            -t "klukai-core:nightly-baseline-$GITHUB_RUN_ID" - >/dev/null
          status=0
          python -B -m tools.ci.perf_stack \
            --baseline-image "$(docker image inspect -f '{{.Id}}' "klukai-core:nightly-baseline-$GITHUB_RUN_ID")" \
            --candidate-image "$(docker image inspect -f '{{.Id}}' "klukai-core:nightly-candidate-$GITHUB_RUN_ID")" \
            --baseline-revision "$base" --candidate-revision "$head" \
            --out "$dir/evidence" || status=$?
          summarize || { [ "$status" -ne 0 ] || status=1; }
          # Bound the guest disk: raw evidence bundles (~180 MB a night) older than
          # 14 days go; each night's small summary.json stays.
          find "$KLUKAI_NIGHTLY_ROOT" -mindepth 2 -maxdepth 2 -type d -name evidence \
            -mtime +14 -prune -print -exec rm -rf {} +
          find "$KLUKAI_NIGHTLY_ROOT/mutation" "$KLUKAI_NIGHTLY_ROOT/trivy" -mindepth 1 \
            -maxdepth 1 -type d -mtime +30 -prune -print -exec rm -rf {} + 2>/dev/null || true
          exit "$status"

  trivy-deep:
    name: Trivy deep scan
    needs: perf-nightly
    if: ${{ !cancelled() && (github.event_name != 'workflow_dispatch' || contains(fromJSON('["all","trivy"]'), inputs.only)) }}
    runs-on: [self-hosted, Linux, X64, ci-heavy]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/nightly-window
        with:
          latest-start: "2300"

      - name: Install trivy if missing (fs scan needs no Docker)
        # The upstream install.sh needs tooling this slim runner lacks, so
        # download the pinned release tarball and verify its sha256 in python.
        run: |
          BIN="${RUNNER_TEMP}/bin"; mkdir -p "$BIN"
          if ! command -v trivy >/dev/null 2>&1 && [[ ! -x "$BIN/trivy" ]]; then
            V=0.71.0
            curl -sfL -o /tmp/trivy.tgz \
              "https://github.com/aquasecurity/trivy/releases/download/v${V}/trivy_${V}_Linux-64bit.tar.gz"
            curl -sfL -o /tmp/trivy.sums \
              "https://github.com/aquasecurity/trivy/releases/download/v${V}/trivy_${V}_checksums.txt"
            python3 - <<'PY'
          import hashlib, sys, tarfile
          want = None
          for line in open("/tmp/trivy.sums"):
              if line.strip().endswith("trivy_0.71.0_Linux-64bit.tar.gz"):
                  want = line.split()[0]
          got = hashlib.sha256(open("/tmp/trivy.tgz", "rb").read()).hexdigest()
          if want is None or got != want:
              sys.exit(f"trivy checksum mismatch: want={want} got={got}")
          with tarfile.open("/tmp/trivy.tgz") as t:
              t.extract("trivy", path="/tmp/trivy-bin", filter="data")
          PY
            install -m 0755 /tmp/trivy-bin/trivy "$BIN/trivy"
          fi
          export PATH="$BIN:$PATH"
          trivy --version

      - name: Trivy filesystem scan (HIGH+CRITICAL BLOCKING)
        run: |
          export PATH="${RUNNER_TEMP}/bin:$PATH"
          trivy fs --severity HIGH,CRITICAL --exit-code 1 --ignore-unfixed \
            --format json --output /tmp/trivy-deep.json .
          # report-only pass for the full severity picture
          trivy fs --severity MEDIUM,HIGH,CRITICAL --exit-code 0 --quiet . || true

      - name: Retain trivy results on the heavy guest (no GitHub storage)
        if: always()
        run: |
          out="${KLUKAI_NIGHTLY_ROOT}/trivy/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          install -d -m 0700 "$out"
          cp /tmp/trivy-deep.json "$out/" 2>/dev/null || echo "no trivy results to retain"

  onboarding:
    name: Onboarding drill (clean clone, docs/onboarding.md)
    needs: [perf-nightly, trivy-deep]
    if: ${{ !cancelled() && (github.event_name != 'workflow_dispatch' || contains(fromJSON('["all","onboarding"]'), inputs.only)) }}
    runs-on: [self-hosted, Linux, X64, ci-heavy]
    timeout-minutes: 30
    env:
      KLUKAI_PERF_POSTGRES_IMAGE: postgres@sha256:6f30057d31f5861b66f3545d4821f987aacf1dd920765f0acadea0c58ff975b1
      KLUKAI_PERF_REDIS_IMAGE: valkey/valkey@sha256:cb3339abbd6e18942cd8ac3349f0c371a82ba5b6204b242563ba299e7956cbd0
      KLUKAI_PERF_QDRANT_IMAGE: qdrant/qdrant@sha256:f1c7272cdac52b38c1a0e89313922d940ba50afd90d593a1605dbbc214e66ffb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/nightly-window
        with:
          latest-start: "2255"   # up to 30 minutes
      - name: Run the documented onboarding steps from a clean clone
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          out="${KLUKAI_NIGHTLY_ROOT}/onboarding/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          install -d -m 0700 "$out"
          python3 tools/ci/onboarding_drill.py --source "$GITHUB_WORKSPACE" \
            --revision "$GITHUB_SHA" --output "$out/result.json"

  mutation:
    name: Mutation test (critical paths, >=80% killed)
    needs: [perf-nightly, trivy-deep, onboarding]
    if: ${{ !cancelled() && (github.event_name != 'workflow_dispatch' || contains(fromJSON('["all","mutation"]'), inputs.only)) }}
    runs-on: [self-hosted, Linux, X64, ci-heavy]
    timeout-minutes: 150
    env:
      KLUKAI_CI_NATIVE_SANDBOX: unavailable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/nightly-window
        with:
          latest-start: "2100"   # up to 150 minutes
      - uses: ./.github/actions/python-tools
        env:
          KLUKAI_CI_OUTPUT: ${{ runner.temp }}/klukai-python-tools/mutation-${{ github.run_id }}-${{ github.run_attempt }}
          KLUKAI_CI_REVISION: ${{ github.sha }}

      - name: Run and validate source-bound mutation evidence
        # tools.ci.mutation snapshots the exact clean checkout, proves a green
        # baseline, runs pinned mutmut with at most two children, binds every
        # mutant to raw pytest observations and fails below 80% killed. The
        # report is written even when the gate fails, so survivors stay visible.
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          out="${KLUKAI_NIGHTLY_ROOT}/mutation/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          install -d -m 0700 "$out"
          echo "KLUKAI_MUTATION_OUT=$out" >> "$GITHUB_ENV"
          python -B -m tools.ci.mutation run --root "$GITHUB_WORKSPACE" \
            --output "$out/evidence" --revision "$GITHUB_SHA" \
            --max-children 2 --timeout 7200

      - name: Summarize and retain mutation results on the heavy guest
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          report="${KLUKAI_MUTATION_OUT:-/nonexistent}/evidence/mutation.json"
          if [[ ! -f "$report" ]]; then
            echo "::error title=No mutation report::the run produced no mutation.json"
            exit 0
          fi
          python3 - "$report" <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import collections, json, sys
          report = json.load(open(sys.argv[1]))
          mutants = report.get("mutants") or []
          counts = collections.Counter(m["status"] for m in mutants)
          total = len(mutants)
          rate = counts["killed"] / total if total else 0.0
          print(f"### Mutation: {counts['killed']}/{total} killed ({rate:.2%}); {dict(counts)}")
          by_module = collections.defaultdict(collections.Counter)
          for m in mutants:
              by_module[m["module"]][m["status"]] += 1
          for module, c in sorted(by_module.items()):
              print(f"- {module}: {dict(c)}")
          if report.get("execution_error"):
              print(f"- execution error: {report['execution_error']}")
          PY
          # The generated snapshot is large and not needed to re-validate the raw
          # evidence; keep mutation.json and raw/ (30-day retention below).
          rm -rf "${KLUKAI_MUTATION_OUT}/evidence/snapshot"
          find "$KLUKAI_NIGHTLY_ROOT/mutation" -mindepth 1 -maxdepth 1 -type d \
            -mtime +30 -prune -print -exec rm -rf {} +
