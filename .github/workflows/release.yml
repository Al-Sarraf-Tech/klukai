name: Klukai Release

# S+ Phase 3-4 — release workflow (per docs/superpowers/specs/2026-05-16-s-plus-uplift.md §7.3, §8.4).
#
# Outputs (per release):
#   - klukai:<tag> image
#   - SBOM in CycloneDX + SPDX (syft)
#   - keyless cosign signature on image + SBOM
#   - SLSA L2 provenance (slsa-github-generator)
#   - CHANGELOG entry from git-cliff
#
# Per absolute global CLAUDE.md: NO actions/attest-build-provenance (paid plan).
# Per absolute global CLAUDE.md: NO darwin/macOS builds.

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry-run (build + sign locally, no push)'
        type: boolean
        default: false

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

env:
  IMAGE: ghcr.io/al-sarraf-tech/klukai
  REGISTRY: ghcr.io

jobs:
  build:
    name: Build & SBOM
    runs-on: [self-hosted, python-slim]
    outputs:
      image_digest: ${{ steps.push.outputs.digest }}
      image_tag: ${{ steps.meta.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute image metadata
        id: meta
        env:
          REF: ${{ github.ref }}
        run: |
          tag="${REF#refs/tags/}"
          [[ -z "$tag" || "$tag" == "$REF" ]] && tag="dispatch-$(date -u +%Y%m%d%H%M%S)"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "epoch=$(git log -1 --format=%ct)" >> "$GITHUB_OUTPUT"

      - name: Build image
        env:
          SOURCE_DATE_EPOCH: ${{ steps.meta.outputs.epoch }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          if ! docker info >/dev/null 2>&1; then
            echo "::error title=Release needs Docker::This runner has no Docker socket — the release build/push/sign jobs require a Docker-enabled runner or host. Assign these jobs accordingly before tagging a release."
            exit 1
          fi
          docker build \
            --build-arg SOURCE_DATE_EPOCH="${SOURCE_DATE_EPOCH}" \
            -t "${IMAGE}:${TAG}" \
            -t "${IMAGE}:latest" \
            docker/core

      - name: Login to GHCR
        if: github.event.inputs.dry_run != 'true'
        # SHA-pinned (tag v3): tags are mutable and this runs on a self-hosted runner
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image
        id: push
        if: github.event.inputs.dry_run != 'true'
        env:
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          docker push "${IMAGE}:${TAG}"
          docker push "${IMAGE}:latest"
          digest=$(docker inspect --format='{{index .RepoDigests 0}}' "${IMAGE}:${TAG}")
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Install syft
        run: |
          if ! command -v syft >/dev/null 2>&1; then
            curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh \
              | sh -s -- -b "$HOME/.local/bin"
            echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          fi

      - name: Generate SBOM (CycloneDX + SPDX)
        env:
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          syft "${IMAGE}:${TAG}" -o cyclonedx-json=sbom.cdx.json -o spdx-json=sbom.spdx.json

      - name: Upload SBOM artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ steps.meta.outputs.tag }}
          path: |
            sbom.cdx.json
            sbom.spdx.json
          retention-days: 90

  sign:
    name: Sign image + SBOM (cosign keyless)
    needs: build
    if: github.event.inputs.dry_run != 'true'
    runs-on: [self-hosted, python-slim]
    steps:
      - name: Install cosign
        run: |
          if ! command -v cosign >/dev/null 2>&1; then
            curl -sSfLo /tmp/cosign \
              https://github.com/sigstore/cosign/releases/latest/download/cosign-linux-amd64
            chmod +x /tmp/cosign
            sudo install /tmp/cosign /usr/local/bin/cosign
          fi

      - name: Cosign keyless sign image
        env:
          COSIGN_EXPERIMENTAL: "1"
          DIGEST: ${{ needs.build.outputs.image_digest }}
        run: |
          cosign sign --yes "$DIGEST"

      - name: Download SBOM
        uses: actions/download-artifact@v4
        with:
          name: sbom-${{ needs.build.outputs.image_tag }}

      - name: Cosign attest SBOM (CycloneDX)
        env:
          COSIGN_EXPERIMENTAL: "1"
          DIGEST: ${{ needs.build.outputs.image_digest }}
        run: |
          cosign attest --yes --type cyclonedx --predicate sbom.cdx.json "$DIGEST"

  changelog:
    name: Update CHANGELOG via git-cliff
    needs: build
    runs-on: [self-hosted, python-slim]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install git-cliff
        run: |
          if ! command -v git-cliff >/dev/null 2>&1; then
            cargo install git-cliff || pip install git-cliff || true
          fi

      - name: Generate release notes
        env:
          TAG: ${{ needs.build.outputs.image_tag }}
        run: |
          if command -v git-cliff >/dev/null 2>&1; then
            git-cliff --tag "$TAG" --unreleased > RELEASE_NOTES.md
          else
            echo "::warning title=Degraded release notes::git-cliff unavailable — release notes are just the last commit message."
            git log -1 --format=%B > RELEASE_NOTES.md
          fi

      - name: Create GitHub release
        if: github.event.inputs.dry_run != 'true'
        # SHA-pinned (tag v2): tags are mutable and this runs on a self-hosted runner
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          tag_name: ${{ needs.build.outputs.image_tag }}
          body_path: RELEASE_NOTES.md
          draft: false
          prerelease: false
