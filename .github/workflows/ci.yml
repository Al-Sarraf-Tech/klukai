name: Klukai CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test Suite
    runs-on: [self-hosted, python-slim]
    defaults:
      run:
        working-directory: docker/core

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-timeout pytest-cov

      - name: Run test suite with coverage
        run: python3 -m pytest tests/ -q --tb=short --cov=app --cov-report=term-missing --cov-fail-under=34

  lint:
    name: Lint
    runs-on: [self-hosted, python-slim]
    defaults:
      run:
        working-directory: docker/core

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install ruff

      - name: Lint with ruff
        run: ruff check app/ --config ruff.toml
