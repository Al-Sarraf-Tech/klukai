name: Klukai CI

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      expected_revision:
        description: Full reviewed branch-head SHA; a moved branch must fail
        required: true
        type: string

permissions:
  contents: read

env:
  KLUKAI_CI_ARTIFACT_ROOT: /opt/klukai-ci/artifacts
  KLUKAI_CI_REVISION: ${{ github.sha }}

jobs:
  # Dispatch uses GitHub's repository write ACL and binds the reviewed branch
  # head on existing self-hosted capacity. No PR event executes fork source.
  source-policy:
    name: Authorized exact source
    runs-on: [fleet-ci-v1, ci-small]
    timeout-minutes: 2
    steps:
      - name: Require reviewed exact source before checkout
        id: admit
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          SOURCE_REF: ${{ github.ref }}
          SOURCE_REVISION: ${{ github.sha }}
          EXPECTED_REVISION: ${{ inputs.expected_revision }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_REVISION" =~ ^[0-9a-f]{40}$ ]]
          [[ "$SOURCE_REF" == refs/heads/* ]]
          case "$EVENT_NAME" in
            push) [[ "$SOURCE_REF" == refs/heads/main ]] ;;
            workflow_dispatch) [[ "$EXPECTED_REVISION" == "$SOURCE_REVISION" ]] ;;
            *) echo 'Unauthorized CI event' >&2; exit 1 ;;
          esac

  ci-image:
    name: Pinned Python CI executor
    needs: source-policy
    runs-on: [self-hosted, Linux, X64, ci-heavy]
    timeout-minutes: 30
    outputs:
      image_id: ${{ steps.build.outputs.image_id }}
    env:
      KLUKAI_CI_OUTPUT: /opt/klukai-ci/artifacts/${{ github.sha }}/${{ github.run_id }}-${{ github.run_attempt }}/ci-image
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Build once and prove the complete pinned Python environment
        id: build
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          python3 -m tools.ci.tool_image --root "$GITHUB_WORKSPACE" \
            --output "$KLUKAI_CI_OUTPUT" --revision "$KLUKAI_CI_REVISION" --timeout 1500
          python3 - <<'PY'
          import json, os, pathlib, re
          result = json.loads((pathlib.Path(os.environ['KLUKAI_CI_OUTPUT']) / 'manifest.json').read_text())
          if result.get('passed') is not True or result.get('certifying') is not True:
              raise SystemExit('CI image producer did not certify its result')
          if result.get('source_unchanged') is not True:
              raise SystemExit('CI image producer source changed')
          if result.get('source_revision') != os.environ['KLUKAI_CI_REVISION']:
              raise SystemExit('CI image producer source revision differs')
          image = result.get('image_id')
          if not isinstance(image, str) or not re.fullmatch(r'sha256:[0-9a-f]{64}', image):
              raise SystemExit('CI image producer returned an invalid immutable image ID')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'image_id={image}\n')
          PY

  components:
    name: Isolated component suites
    needs: source-policy
    runs-on: [self-hosted, Linux, X64, ci-heavy]
    timeout-minutes: 20
    env:
      # Light containers drop all capabilities and the Ubuntu heavy guest restricts
      # unprivileged user namespaces; wheels still build offline from hash-verified
      # downloads and the report records the missing sandbox.
      KLUKAI_CI_NATIVE_SANDBOX: unavailable
      # Pinned native Chrome on the heavy guest (AppArmor userns profile installed).
      KLUKAI_CHROME_BINARY: /opt/klukai-ci/toolchains/b838d34bba223857b3cab6b924de31a9ddee0c1f7c81df7611f3a0cb883a17c7/chrome/chrome
      KLUKAI_TEST_ALLOW_LIVE_BACKENDS: "0"
      KLUKAI_CLAUDE_PRIMARY: "false"
      KLUKAI_CREATIVE_TEXT_PROVIDER: "local"
      ANTHROPIC_API_KEY: ""
      OPENAI_API_KEY: ""
      LM_STUDIO_URL: "http://127.0.0.1:1"
      VOICE_URL: "http://127.0.0.1:1"
      COMFYUI_URL: "http://127.0.0.1:1"
      KLUKAI_AGY_SOCKET: "/tmp/klukai-ci-no-account/image.sock"
      KLUKAI_AGY_TOKEN_FILE: "/tmp/klukai-ci-no-account/token"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/heavy-userns
      - uses: ./.github/actions/node
      - name: Verify native component prerequisites and private Compose
        run: |
          python3 -m tools.ci.component_environment prepare --root "$GITHUB_WORKSPACE" \
            --output "${RUNNER_TEMP}/klukai-component-native" --revision "$GITHUB_SHA"
      - uses: ./.github/actions/python-tools
        env:
          KLUKAI_CI_OUTPUT: ${{ runner.temp }}/klukai-component-python
          KLUKAI_CI_REVISION: ${{ github.sha }}
      - name: Build isolated complete bridge test closure
        run: |
          python3 -m tools.ci.light_environment --role bridge --root "$GITHUB_WORKSPACE" \
            --output "${RUNNER_TEMP}/klukai-bridge-python" --revision "$GITHUB_SHA"
      - name: Validate all environments before selecting component interpreters
        run: |
          python3 -m tools.ci.component_environment export --root "$GITHUB_WORKSPACE" \
            --output "${RUNNER_TEMP}/klukai-component-native" --revision "$GITHUB_SHA" \
            --tools "${RUNNER_TEMP}/klukai-component-python" \
            --bridge "${RUNNER_TEMP}/klukai-bridge-python" --github-env "$GITHUB_ENV"
      - name: Run bot, operations, voice and bridge in separate pytest processes
        env:
          PYTHONWARNINGS: error
          PYTEST_ADDOPTS: "-o asyncio_default_fixture_loop_scope=function -o asyncio_default_test_loop_scope=function"
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          make test-tgbot test-ops test-voice TEST_PYTHON="$KLUKAI_COMPONENT_PYTHON"
          make test-bridge TEST_PYTHON="$KLUKAI_BRIDGE_PYTHON"
      - name: Install locked avatar test dependencies
        run: npm ci --prefix tools/avatar --ignore-scripts
      - name: Run companion and avatar JavaScript tests
        run: make test-js
      - name: Check shell scripts
        run: make test-shell

  test:
    name: Test Suite
    needs: ci-image
    runs-on: [self-hosted, Linux, X64, ci-heavy]
    timeout-minutes: 25
    env:
      KLUKAI_CI_OUTPUT: /opt/klukai-ci/artifacts/${{ github.sha }}/${{ github.run_id }}-${{ github.run_attempt }}/core
      KLUKAI_CORE_CI_IMAGE: ${{ needs.ci-image.outputs.image_id }}
      KLUKAI_CORE_POSTGRES_IMAGE: postgres@sha256:6f30057d31f5861b66f3545d4821f987aacf1dd920765f0acadea0c58ff975b1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Run full core with disposable PostgreSQL and retained coverage
        run: scripts/ci/core.sh

  real-backends:
    name: Real PostgreSQL, Valkey and Qdrant recovery
    needs: ci-image
    runs-on: [self-hosted, Linux, X64, ci-heavy]
    timeout-minutes: 20
    env:
      KLUKAI_CI_OUTPUT: /opt/klukai-ci/artifacts/${{ github.sha }}/${{ github.run_id }}-${{ github.run_attempt }}/backends
      KLUKAI_CORE_CI_IMAGE: ${{ needs.ci-image.outputs.image_id }}
      KLUKAI_CORE_POSTGRES_IMAGE: postgres@sha256:6f30057d31f5861b66f3545d4821f987aacf1dd920765f0acadea0c58ff975b1
      KLUKAI_CORE_REDIS_IMAGE: valkey/valkey@sha256:cb3339abbd6e18942cd8ac3349f0c371a82ba5b6204b242563ba299e7956cbd0
      KLUKAI_CORE_QDRANT_IMAGE: qdrant/qdrant@sha256:f1c7272cdac52b38c1a0e89313922d940ba50afd90d593a1605dbbc214e66ffb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Require all nine real-driver fault and recovery cases
        run: scripts/ci/backends.sh

  lint:
    name: Lint
    needs: source-policy
    runs-on: [fleet-ci-v1, ci-small]
    timeout-minutes: 20
    env:
      # Light containers drop all capabilities and the Ubuntu heavy guest restricts
      # unprivileged user namespaces; wheels still build offline from hash-verified
      # downloads and the report records the missing sandbox.
      KLUKAI_CI_NATIVE_SANDBOX: unavailable
    defaults:
      run:
        working-directory: docker/core

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: ./.github/actions/python-tools
        env:
          # runner context is unavailable in job-level env.
          KLUKAI_CI_OUTPUT: ${{ runner.temp }}/klukai-python-tools/${{ github.sha }}/${{ github.run_id }}-${{ github.run_attempt }}/lint

      - name: Lint with ruff
        run: |
          python -m ruff check app/ --config ruff.toml
          python -m ruff format --check app/ --config ruff.toml

  typecheck:
    name: Type Check (mypy)
    needs: source-policy
    runs-on: [fleet-ci-v1, ci-small]
    timeout-minutes: 20
    env:
      # Light containers drop all capabilities and the Ubuntu heavy guest restricts
      # unprivileged user namespaces; wheels still build offline from hash-verified
      # downloads and the report records the missing sandbox.
      KLUKAI_CI_NATIVE_SANDBOX: unavailable
    defaults:
      run:
        working-directory: docker/core

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: ./.github/actions/python-tools
        env:
          # runner context is unavailable in job-level env.
          KLUKAI_CI_OUTPUT: ${{ runner.temp }}/klukai-python-tools/${{ github.sha }}/${{ github.run_id }}-${{ github.run_attempt }}/typecheck

      - name: Type-check with mypy
        run: python -m mypy app/ --config-file mypy.ini

  security:
    name: Security Scan (bandit + safety)
    needs: source-policy
    runs-on: [fleet-ci-v1, ci-small]
    timeout-minutes: 20
    env:
      # Light containers drop all capabilities and the Ubuntu heavy guest restricts
      # unprivileged user namespaces; wheels still build offline from hash-verified
      # downloads and the report records the missing sandbox.
      KLUKAI_CI_NATIVE_SANDBOX: unavailable
    defaults:
      run:
        working-directory: docker/core

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: ./.github/actions/python-tools
        env:
          # runner context is unavailable in job-level env.
          KLUKAI_CI_OUTPUT: ${{ runner.temp }}/klukai-python-tools/${{ github.sha }}/${{ github.run_id }}-${{ github.run_attempt }}/security

      - name: SAST — bandit (high-severity only)
        run: python -m bandit -r app/ -ll --skip B101

      - name: Dependency vulnerability — pip-audit (BLOCKING)
        run: |
          python -m pip_audit --strict --no-deps --disable-pip --require-hashes --requirement requirements.txt
          python -m pip_audit --strict --no-deps --disable-pip --require-hashes --requirement requirements-ci.txt

  image-scan:
    name: Image Scan (trivy)
    needs: source-policy
    runs-on: [self-hosted, Linux, X64, ci-heavy]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Trivy image scan (HIGH+CRITICAL block)
        # This job requires heavy Docker-capable capacity. Missing capability
        # is a failed gate and must never certify an unscanned release.
        run: |
          command -v docker
          docker info >/dev/null
          BIN="${RUNNER_TEMP:-/tmp}/bin"; mkdir -p "$BIN"; export PATH="$BIN:$PATH"
          command -v trivy >/dev/null 2>&1 || \
            curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/v0.71.0/contrib/install.sh \
              | sh -s -- -b "$BIN" v0.71.0
          trivy --version
          image="klukai-core:release-${GITHUB_SHA}"
          docker build --build-arg VCS_REF="$GITHUB_SHA" \
            --label org.opencontainers.image.revision="$GITHUB_SHA" \
            -t "$image" -f docker/core/Dockerfile docker/core/
          trivy image --severity HIGH,CRITICAL --exit-code 1 --no-progress "$image"

      - name: Retain the scanned image for digest-verified deployment
        # Amarillo pulls this exact tar through the Dominus guest agent after the
        # whole run is green (ops/amarillo/scripts/klukai-fetch-ci-artifacts.py)
        # and checks its hash, layers and revision before tagging it for deploy.
        env:
          RELEASE_DIR: /opt/klukai-ci/artifacts/${{ github.sha }}/${{ github.run_id }}-${{ github.run_attempt }}/release
        run: |
          set -euo pipefail
          umask 077
          image="klukai-core:release-${GITHUB_SHA}"
          python3 -m tools.ci.release_artifact save --image "$image" \
            --revision "$GITHUB_SHA" --output "$RELEASE_DIR" \
            --run "${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          docker image rm "$image" >/dev/null
          # Bound the guest disk: image tars (~200 MB each) older than 7 days go;
          # their manifests stay as the record. The relay refuses a missing tar.
          find "$KLUKAI_CI_ARTIFACT_ROOT" -mindepth 4 -maxdepth 4 -type f \
            -path '*/release/core-image.tar' -mtime +7 -print -delete



  perf-gate:
    name: Perf Gate (p99 regression check)
    needs: source-policy
    runs-on: [self-hosted, Linux, X64, ci-heavy]
    timeout-minutes: 60
    env:
      KLUKAI_CI_NATIVE_SANDBOX: unavailable
      # Same reviewed images as perf_resources.BACKEND_IMAGES, by registry digest.
      KLUKAI_PERF_POSTGRES_IMAGE: postgres@sha256:6f30057d31f5861b66f3545d4821f987aacf1dd920765f0acadea0c58ff975b1
      KLUKAI_PERF_REDIS_IMAGE: valkey/valkey@sha256:cb3339abbd6e18942cd8ac3349f0c371a82ba5b6204b242563ba299e7956cbd0
      KLUKAI_PERF_QDRANT_IMAGE: qdrant/qdrant@sha256:f1c7272cdac52b38c1a0e89313922d940ba50afd90d593a1605dbbc214e66ffb
      KLUKAI_PERF_FIXTURE_IMAGE: python@sha256:dc1546eefcbe8caaa1f004f16ab76b204b5e1dbd58ff81b899f21cd40541232f
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/actions/python-tools
        env:
          KLUKAI_CI_OUTPUT: ${{ runner.temp }}/klukai-python-tools/${{ github.sha }}/${{ github.run_id }}-${{ github.run_attempt }}/perf

      - name: Build the candidate and the previous main revision
        id: images
        shell: bash
        run: |
          set -euo pipefail
          command -v docker
          docker info >/dev/null
          base=$(git merge-base origin/main "$GITHUB_SHA")
          if [ "$base" = "$GITHUB_SHA" ]; then base=$(git rev-parse "$GITHUB_SHA^1"); fi
          for image in "$KLUKAI_PERF_POSTGRES_IMAGE" "$KLUKAI_PERF_REDIS_IMAGE" \
                       "$KLUKAI_PERF_QDRANT_IMAGE" "$KLUKAI_PERF_FIXTURE_IMAGE"; do
            docker pull --quiet "$image" >/dev/null
          done
          docker build --quiet --build-arg VCS_REF="$GITHUB_SHA" \
            --label org.opencontainers.image.revision="$GITHUB_SHA" \
            -t "klukai-core:perf-candidate-$GITHUB_RUN_ID" docker/core >/dev/null
          git archive --format=tar "$base:docker/core" | docker build --quiet \
            --build-arg VCS_REF="$base" --label org.opencontainers.image.revision="$base" \
            -t "klukai-core:perf-baseline-$GITHUB_RUN_ID" - >/dev/null
          {
            echo "baseline_revision=$base"
            echo "baseline_image=$(docker image inspect --format '{{.Id}}' "klukai-core:perf-baseline-$GITHUB_RUN_ID")"
            echo "candidate_image=$(docker image inspect --format '{{.Id}}' "klukai-core:perf-candidate-$GITHUB_RUN_ID")"
          } >> "$GITHUB_OUTPUT"

      - name: Paired disposable p99 gate (20% budget, absolute SLOs)
        shell: bash
        env:
          BASELINE_IMAGE: ${{ steps.images.outputs.baseline_image }}
          CANDIDATE_IMAGE: ${{ steps.images.outputs.candidate_image }}
          BASELINE_REVISION: ${{ steps.images.outputs.baseline_revision }}
        run: |
          set -euo pipefail
          out="${KLUKAI_CI_ARTIFACT_ROOT%/}/${GITHUB_SHA}/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}/perf"
          python -B -m tools.ci.perf_stack \
            --baseline-image "$BASELINE_IMAGE" --candidate-image "$CANDIDATE_IMAGE" \
            --baseline-revision "$BASELINE_REVISION" --candidate-revision "$GITHUB_SHA" \
            --out "$out"

      - name: Remove run-scoped perf images
        if: always()
        run: |
          docker image rm "klukai-core:perf-candidate-$GITHUB_RUN_ID" \
            "klukai-core:perf-baseline-$GITHUB_RUN_ID" >/dev/null 2>&1 || true

  frontend:
    name: Frontend validation and immutable PWA evidence
    needs: source-policy
    runs-on: [self-hosted, Linux, X64, ci-heavy]
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      # Verified existing heavy-guest capacity, runner-owned and mode 0700.
      # Each run requires a fresh directory; missing storage fails the job.
      KLUKAI_CI_ARTIFACT_ROOT: /opt/klukai-ci/artifacts
      # Owner snapshot verified on the existing guest; this is not an official
      # Flutter release archive. Exact source/tool identities enter evidence.
      FLUTTER: /opt/klukai-ci/toolchains/b838d34bba223857b3cab6b924de31a9ddee0c1f7c81df7611f3a0cb883a17c7/flutter/bin/flutter
      KLUKAI_CHROME_BINARY: /opt/klukai-ci/toolchains/b838d34bba223857b3cab6b924de31a9ddee0c1f7c81df7611f3a0cb883a17c7/chrome/chrome
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/node
      - name: Require private evidence storage and run all frontend gates
        shell: bash
        run: |
          : "${KLUKAI_CI_ARTIFACT_ROOT:?Configure private storage on the existing heavy runner}"
          export KLUKAI_CI_OUTPUT="${KLUKAI_CI_ARTIFACT_ROOT%/}/${GITHUB_SHA}/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}/frontend"
          scripts/ci/frontend.sh

  all-required:
    name: Required CI gates
    if: always()
    needs: [source-policy, ci-image, components, test, real-backends, lint, typecheck, security, image-scan, perf-gate, frontend]
    runs-on: [fleet-ci-v1, ci-small]
    timeout-minutes: 2
    env:
      REQUIRED_JOBS: '["source-policy","ci-image","components","test","real-backends","lint","typecheck","security","image-scan","perf-gate","frontend"]'
    steps:
      - name: Reject missing, failed, cancelled or skipped required jobs
        id: verify
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os
          actual = json.loads(os.environ['NEEDS_JSON'])
          expected = json.loads(os.environ['REQUIRED_JOBS'])
          if set(actual) != set(expected) or not actual:
              raise SystemExit('Missing required CI results')
          if any(row.get('result') != 'success' for row in actual.values()):
              raise SystemExit('Required CI jobs did not all succeed')
          PY
