name: Klukai CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test Suite
    runs-on: [self-hosted, python-slim]
    defaults:
      run:
        working-directory: docker/core

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install pytest pytest-asyncio pytest-timeout httpx pydantic PyYAML

      - name: Run test suite
        run: python3 -m pytest tests/ -q --tb=short

  lint:
    name: Lint
    runs-on: [self-hosted, python-slim]
    defaults:
      run:
        working-directory: docker/core

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install ruff

      - name: Lint with ruff
        run: ruff check app/ --select E,F,W --ignore E501
