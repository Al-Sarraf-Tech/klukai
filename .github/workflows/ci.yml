name: Klukai CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test Suite
    runs-on: [self-hosted, python-slim]
    defaults:
      run:
        working-directory: docker/core

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-timeout pytest-cov

      - name: Run test suite with coverage
        run: python3 -m pytest tests/ -q --tb=short --cov=app --cov-report=term-missing --cov-fail-under=95

  lint:
    name: Lint
    runs-on: [self-hosted, python-slim]
    defaults:
      run:
        working-directory: docker/core

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install ruff

      - name: Lint with ruff
        run: ruff check app/ --config ruff.toml

  typecheck:
    name: Type Check (mypy)
    runs-on: [self-hosted, python-slim]
    defaults:
      run:
        working-directory: docker/core

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install mypy types-PyYAML

      - name: Type-check with mypy
        run: mypy app/ --config-file mypy.ini

  security:
    name: Security Scan (bandit + safety)
    runs-on: [self-hosted, python-slim]
    defaults:
      run:
        working-directory: docker/core

    steps:
      - uses: actions/checkout@v4

      - name: Install scanners
        run: |
          python3 -m pip install --upgrade pip
          pip install bandit pip-audit

      - name: SAST — bandit (high-severity only)
        run: bandit -r app/ -ll --skip B101

      - name: Dependency vulnerability — pip-audit (BLOCKING)
        # Fails the build on any known-vulnerable pinned dependency. Replaces
        # the old `safety check ... || true`, which could never fail the job.
        # For a triaged false positive, add a documented `--ignore-vuln <ID>`.
        run: pip-audit --requirement requirements.txt

  image-scan:
    name: Image Scan (trivy)
    runs-on: [self-hosted, python-slim]

    steps:
      - uses: actions/checkout@v4

      - name: Ensure trivy is installed (pinned)
        # No silent skip: if trivy is absent, install a pinned version; if that
        # fails, the job fails loudly. A green image-scan must mean the image
        # was actually scanned — not that the scanner happened to be missing.
        run: |
          if ! command -v trivy >/dev/null 2>&1; then
            curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/v0.58.1/contrib/install.sh \
              | sh -s -- -b /usr/local/bin v0.58.1
          fi
          trivy --version

      - name: Build image
        run: docker build -t klukai-core:ci -f docker/core/Dockerfile docker/core/

      - name: Trivy scan — HIGH + CRITICAL fail
        run: |
          trivy image \
            --severity HIGH,CRITICAL \
            --exit-code 1 \
            --ignore-unfixed \
            --no-progress \
            klukai-core:ci

      - name: Trivy scan — full report (informational)
        run: |
          trivy image \
            --severity LOW,MEDIUM,HIGH,CRITICAL \
            --no-progress \
            klukai-core:ci || true



  perf-gate:
    name: Perf Gate (p99 regression check)
    runs-on: [self-hosted, python-slim]
    defaults:
      run:
        working-directory: docker/core
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio

      - name: Probe live klukai-core if reachable
        run: |
          if curl -sf -m 3 http://localhost:8300/health >/dev/null 2>&1; then
            python3 ../../tools/load-test/probe.py \
              --base http://localhost:8300 \
              --requests 100 \
              --concurrency 5 \
              --out /tmp/perf-current.json
          else
            echo "klukai-core not reachable on this runner — perf gate skipped"
            exit 0
          fi

      - name: Compare p99 against committed baseline (20% delta threshold)
        run: |
          [[ -f /tmp/perf-current.json ]] || { echo "no current snapshot"; exit 0; }
          python3 - <<'PY'
          import json, sys
          from pathlib import Path

          base = json.loads(Path("../../docs/perf-baseline.json").read_text())
          cur  = json.loads(Path("/tmp/perf-current.json").read_text())
          P99_DELTA_THRESHOLD = 1.20  # 20% — per docs/superpowers/specs/2026-05-16-s-plus-uplift.md Q10

          regressions = []
          for endpoint, base_stats in base.items():
              if not isinstance(base_stats, dict):
                  continue
              base_p99 = base_stats.get("p99_ms")
              cur_stats = cur.get(endpoint, {})
              cur_p99 = cur_stats.get("p99_ms") if isinstance(cur_stats, dict) else None
              if base_p99 is None or cur_p99 is None:
                  continue
              if cur_p99 > base_p99 * P99_DELTA_THRESHOLD:
                  regressions.append((endpoint, base_p99, cur_p99))

          if regressions:
              print("PERF REGRESSION:")
              for ep, bp, cp in regressions:
                  print(f"  {ep}: baseline {bp:.1f}ms  current {cp:.1f}ms  (>{(P99_DELTA_THRESHOLD-1)*100:.0f}% increase)")
              sys.exit(1)
          print("perf within budget")
          PY
