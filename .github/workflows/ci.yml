name: Klukai CI

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      expected_revision:
        description: Full reviewed branch-head SHA; a moved branch must fail
        required: true
        type: string

permissions:
  contents: read

env:
  KLUKAI_CI_ARTIFACT_ROOT: /opt/klukai-ci/artifacts
  KLUKAI_CI_REVISION: ${{ github.sha }}

jobs:
  # Dispatch uses GitHub's repository write ACL and binds the reviewed branch
  # head on existing self-hosted capacity. No PR event executes fork source.
  source-policy:
    name: Authorized exact source
    runs-on: [fleet-ci-v1, ci-small]
    timeout-minutes: 2
    steps:
      - name: Require reviewed exact source before checkout
        id: admit
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          SOURCE_REF: ${{ github.ref }}
          SOURCE_REVISION: ${{ github.sha }}
          EXPECTED_REVISION: ${{ inputs.expected_revision }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_REVISION" =~ ^[0-9a-f]{40}$ ]]
          [[ "$SOURCE_REF" == refs/heads/* ]]
          case "$EVENT_NAME" in
            push) [[ "$SOURCE_REF" == refs/heads/main ]] ;;
            workflow_dispatch) [[ "$EXPECTED_REVISION" == "$SOURCE_REVISION" ]] ;;
            *) echo 'Unauthorized CI event' >&2; exit 1 ;;
          esac

  ci-image:
    name: Pinned Python CI executor
    needs: source-policy
    runs-on: [self-hosted, Linux, X64, ci-heavy]
    timeout-minutes: 30
    outputs:
      image_id: ${{ steps.build.outputs.image_id }}
    env:
      KLUKAI_CI_OUTPUT: /opt/klukai-ci/artifacts/${{ github.sha }}/${{ github.run_id }}-${{ github.run_attempt }}/ci-image
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Build once and prove the complete pinned Python environment
        id: build
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          python3 -m tools.ci.tool_image --root "$GITHUB_WORKSPACE" \
            --output "$KLUKAI_CI_OUTPUT" --revision "$KLUKAI_CI_REVISION" --timeout 1500
          python3 - <<'PY'
          import json, os, pathlib, re
          result = json.loads((pathlib.Path(os.environ['KLUKAI_CI_OUTPUT']) / 'manifest.json').read_text())
          if result.get('passed') is not True or result.get('certifying') is not True:
              raise SystemExit('CI image producer did not certify its result')
          if result.get('source_unchanged') is not True:
              raise SystemExit('CI image producer source changed')
          if result.get('source_revision') != os.environ['KLUKAI_CI_REVISION']:
              raise SystemExit('CI image producer source revision differs')
          image = result.get('image_id')
          if not isinstance(image, str) or not re.fullmatch(r'sha256:[0-9a-f]{64}', image):
              raise SystemExit('CI image producer returned an invalid immutable image ID')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'image_id={image}\n')
          PY

  components:
    name: Isolated component suites
    needs: source-policy
    runs-on: [self-hosted, Linux, X64, ci-heavy]
    timeout-minutes: 20
    env:
      KLUKAI_TEST_ALLOW_LIVE_BACKENDS: "0"
      KLUKAI_CLAUDE_PRIMARY: "false"
      KLUKAI_CREATIVE_TEXT_PROVIDER: "local"
      ANTHROPIC_API_KEY: ""
      OPENAI_API_KEY: ""
      LM_STUDIO_URL: "http://127.0.0.1:1"
      VOICE_URL: "http://127.0.0.1:1"
      COMFYUI_URL: "http://127.0.0.1:1"
      KLUKAI_AGY_SOCKET: "/tmp/klukai-ci-no-account/image.sock"
      KLUKAI_AGY_TOKEN_FILE: "/tmp/klukai-ci-no-account/token"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Prepare native operations test tools
        run: |
          if ! command -v bwrap >/dev/null 2>&1 || ! command -v apparmor_parser >/dev/null 2>&1; then
            sudo -n apt-get update
            sudo -n apt-get install -y --no-install-recommends --no-upgrade bubblewrap apparmor
          fi
          bwrap --version
      - name: Prepare pinned Compose contract renderer
        run: |
          # Compose 2.40 omits explicit false values from JSON. Use the same
          # supported renderer as the local contract proof; do not relax it.
          ci_docker_config="${RUNNER_TEMP}/klukai-compose"
          mkdir -p "$ci_docker_config/cli-plugins"
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' --max-time 120 \
            https://github.com/docker/compose/releases/download/v5.6.0/docker-compose-linux-x86_64 \
            --output "$ci_docker_config/cli-plugins/docker-compose"
          echo "40343e21ca777173e69cff5dbafeb37c6f81f3b0d57d9e597f036e95eb63e76a  $ci_docker_config/cli-plugins/docker-compose" | sha256sum --check
          chmod 0755 "$ci_docker_config/cli-plugins/docker-compose"
          echo "DOCKER_CONFIG=$ci_docker_config" >> "$GITHUB_ENV"
          DOCKER_CONFIG="$ci_docker_config" docker compose version
      - name: Prepare scoped Bubblewrap namespace policy
        run: |
          if ! bwrap --ro-bind / / -- /usr/bin/true; then
            # Use the upstream ABI 4.0 profile recommended by Ubuntu. Children
            # lose capabilities; the global user-namespace restriction stays on.
            sudo -n test -r /sys/kernel/security/apparmor/profiles
            if sudo -n grep -q bwrap /sys/kernel/security/apparmor/profiles; then
              echo 'An existing Bubblewrap policy requires operator review; refusing to replace it.' >&2
              exit 1
            fi
            ci_bwrap_profile="${RUNNER_TEMP}/klukai-bwrap-userns-restrict"
            curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' --max-time 120 \
              https://gitlab.com/apparmor/apparmor/-/raw/b4dfdf50f50ed1d64161424d036a2453645f0cfe/profiles/apparmor/profiles/extras/bwrap-userns-restrict \
              --output "$ci_bwrap_profile"
            echo "a964037f6cf0df1099f14226b037eaedde6237c86e715188e93eb460b30be859  $ci_bwrap_profile" | sha256sum --check
            echo "KLUKAI_CI_BWRAP_PROFILE=$ci_bwrap_profile" >> "$GITHUB_ENV"
            sudo -n apparmor_parser --replace "$ci_bwrap_profile"
            bwrap --ro-bind / / -- /usr/bin/true
          fi
      - uses: ./.github/actions/node
      - name: Prepare isolated test environment from existing component requirements
        run: |
          python3 -m venv "${RUNNER_TEMP}/klukai-component-tests"
          # Keep the hashed application lock in its own pip invocation.
          "${RUNNER_TEMP}/klukai-component-tests/bin/python" -m pip install \
            -r docker/core/requirements.txt
          "${RUNNER_TEMP}/klukai-component-tests/bin/python" -m pip install \
            -r tgbot/requirements.txt python-multipart==0.0.22 \
            pytest==9.0.2 pytest-asyncio==1.3.0 pytest-timeout==2.4.0
          # Bridge pins an older Redis than core; never resolve them together.
          python3 -m venv "${RUNNER_TEMP}/klukai-bridge-tests"
          "${RUNNER_TEMP}/klukai-bridge-tests/bin/python" -m pip install \
            -r docker/events-bridge/requirements.txt \
            pytest==9.0.2 pytest-asyncio==1.3.0 pytest-timeout==2.4.0
      - name: Run bot, operations, voice and bridge in separate pytest processes
        run: |
          make test-tgbot test-ops test-voice \
            TEST_PYTHON="${RUNNER_TEMP}/klukai-component-tests/bin/python"
          make test-bridge TEST_PYTHON="${RUNNER_TEMP}/klukai-bridge-tests/bin/python"
      - name: Check existing JavaScript and shell tooling
        # Missing tooling is a failed gate, never a silently skipped suite.
        # Keep the owner's existing runner; no hosted/paid runner fallback.
        run: |
          command -v node
          command -v shellcheck
          node --version
          shellcheck --version
      - name: Install locked avatar test dependencies
        run: npm ci --prefix tools/avatar --ignore-scripts
      - name: Run companion and avatar JavaScript tests
        run: make test-js
      - name: Check shell scripts
        run: make test-shell
      - name: Remove job-specific Bubblewrap policy
        if: always()
        run: |
          if [ -n "${KLUKAI_CI_BWRAP_PROFILE:-}" ]; then
            if ! sudo -n apparmor_parser --remove "$KLUKAI_CI_BWRAP_PROFILE"; then
              # Loading may have been interrupted. Absence is clean; a
              # remaining profile is a real cleanup failure.
              if sudo -n grep -Eq '^(bwrap|unpriv_bwrap)( |//)' /sys/kernel/security/apparmor/profiles; then
                exit 1
              fi
            fi
          fi

  test:
    name: Test Suite
    needs: ci-image
    runs-on: [self-hosted, Linux, X64, ci-heavy]
    timeout-minutes: 25
    env:
      KLUKAI_CI_OUTPUT: /opt/klukai-ci/artifacts/${{ github.sha }}/${{ github.run_id }}-${{ github.run_attempt }}/core
      KLUKAI_CORE_CI_IMAGE: ${{ needs.ci-image.outputs.image_id }}
      KLUKAI_CORE_POSTGRES_IMAGE: postgres@sha256:6f30057d31f5861b66f3545d4821f987aacf1dd920765f0acadea0c58ff975b1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Run full core with disposable PostgreSQL and retained coverage
        run: scripts/ci/core.sh

  real-backends:
    name: Real PostgreSQL, Valkey and Qdrant recovery
    needs: ci-image
    runs-on: [self-hosted, Linux, X64, ci-heavy]
    timeout-minutes: 20
    env:
      KLUKAI_CI_OUTPUT: /opt/klukai-ci/artifacts/${{ github.sha }}/${{ github.run_id }}-${{ github.run_attempt }}/backends
      KLUKAI_CORE_CI_IMAGE: ${{ needs.ci-image.outputs.image_id }}
      KLUKAI_CORE_POSTGRES_IMAGE: postgres@sha256:6f30057d31f5861b66f3545d4821f987aacf1dd920765f0acadea0c58ff975b1
      KLUKAI_CORE_REDIS_IMAGE: valkey/valkey@sha256:cb3339abbd6e18942cd8ac3349f0c371a82ba5b6204b242563ba299e7956cbd0
      KLUKAI_CORE_QDRANT_IMAGE: qdrant/qdrant@sha256:f1c7272cdac52b38c1a0e89313922d940ba50afd90d593a1605dbbc214e66ffb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Require all nine real-driver fault and recovery cases
        run: scripts/ci/backends.sh

  lint:
    name: Lint
    needs: source-policy
    runs-on: [fleet-ci-v1, ci-small]
    defaults:
      run:
        working-directory: docker/core

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Prepare isolated Python environment
        run: |
          python3 -m venv "${RUNNER_TEMP}/python"
          echo "${RUNNER_TEMP}/python/bin" >> "$GITHUB_PATH"
          echo "VIRTUAL_ENV=${RUNNER_TEMP}/python" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install ruff

      - name: Lint with ruff
        run: ruff check app/ --config ruff.toml

  typecheck:
    name: Type Check (mypy)
    needs: source-policy
    runs-on: [fleet-ci-v1, ci-small]
    defaults:
      run:
        working-directory: docker/core

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Prepare isolated Python environment
        run: |
          python3 -m venv "${RUNNER_TEMP}/python"
          echo "${RUNNER_TEMP}/python/bin" >> "$GITHUB_PATH"
          echo "VIRTUAL_ENV=${RUNNER_TEMP}/python" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install mypy types-PyYAML

      - name: Type-check with mypy
        run: mypy app/ --config-file mypy.ini

  security:
    name: Security Scan (bandit + safety)
    needs: source-policy
    runs-on: [fleet-ci-v1, ci-small]
    defaults:
      run:
        working-directory: docker/core

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Prepare isolated Python environment
        run: |
          python3 -m venv "${RUNNER_TEMP}/python"
          echo "${RUNNER_TEMP}/python/bin" >> "$GITHUB_PATH"
          echo "VIRTUAL_ENV=${RUNNER_TEMP}/python" >> "$GITHUB_ENV"

      - name: Install scanners
        run: |
          python3 -m pip install --upgrade pip
          pip install bandit pip-audit

      - name: SAST — bandit (high-severity only)
        run: bandit -r app/ -ll --skip B101

      - name: Dependency vulnerability — pip-audit (BLOCKING)
        # Fails the build on any known-vulnerable pinned dependency. Replaces
        # the old `safety check ... || true`, which could never fail the job.
        # For a triaged false positive, add a documented `--ignore-vuln <ID>`.
        run: pip-audit --requirement requirements.txt

  image-scan:
    name: Image Scan (trivy)
    needs: source-policy
    runs-on: [self-hosted, Linux, X64, ci-heavy]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Trivy image scan (HIGH+CRITICAL block)
        # This job requires heavy Docker-capable capacity. Missing capability
        # is a failed gate and must never certify an unscanned release.
        run: |
          command -v docker
          docker info >/dev/null
          BIN="${RUNNER_TEMP:-/tmp}/bin"; mkdir -p "$BIN"; export PATH="$BIN:$PATH"
          command -v trivy >/dev/null 2>&1 || \
            curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/v0.71.0/contrib/install.sh \
              | sh -s -- -b "$BIN" v0.71.0
          trivy --version
          docker build -t klukai-core:ci -f docker/core/Dockerfile docker/core/
          trivy image --severity HIGH,CRITICAL --exit-code 1 --no-progress klukai-core:ci



  perf-gate:
    name: Perf Gate (p99 regression check)
    needs: source-policy
    runs-on: [self-hosted, Linux, X64, ci-heavy]
    defaults:
      run:
        working-directory: docker/core
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio

      - name: Require target and capture performance samples
        run: |
          curl --fail --silent --show-error --max-time 3 http://localhost:8300/health >/dev/null
          python3 ../../tools/load-test/probe.py \
            --base http://localhost:8300 \
            --requests 100 \
            --concurrency 5 \
            --out /tmp/perf-current.json

      - name: Compare p99 against committed baseline (20% delta threshold)
        # Single source of truth for the comparison: tools/load-test/perf_compare.py
        # (the old inline script read a schema probe.py never produced, so the
        # gate compared zero endpoints and always passed — fixed 2026-06-11).
        run: |
          test -s /tmp/perf-current.json
          python3 ../../tools/load-test/perf_compare.py \
            ../../docs/perf-baseline.json /tmp/perf-current.json --threshold 1.20

  frontend:
    name: Frontend validation and immutable PWA evidence
    needs: source-policy
    runs-on: [self-hosted, Linux, X64, ci-heavy]
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      # Verified existing heavy-guest capacity, runner-owned and mode 0700.
      # Each run requires a fresh directory; missing storage fails the job.
      KLUKAI_CI_ARTIFACT_ROOT: /opt/klukai-ci/artifacts
      # Owner snapshot verified on the existing guest; this is not an official
      # Flutter release archive. Exact source/tool identities enter evidence.
      FLUTTER: /opt/klukai-ci/toolchains/b838d34bba223857b3cab6b924de31a9ddee0c1f7c81df7611f3a0cb883a17c7/flutter/bin/flutter
      KLUKAI_CHROME_BINARY: /opt/klukai-ci/toolchains/b838d34bba223857b3cab6b924de31a9ddee0c1f7c81df7611f3a0cb883a17c7/chrome/chrome
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/node
      - name: Require private evidence storage and run all frontend gates
        shell: bash
        run: |
          : "${KLUKAI_CI_ARTIFACT_ROOT:?Configure private storage on the existing heavy runner}"
          export KLUKAI_CI_OUTPUT="${KLUKAI_CI_ARTIFACT_ROOT%/}/${GITHUB_SHA}/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}/frontend"
          scripts/ci/frontend.sh

  all-required:
    name: Required CI gates
    if: always()
    needs: [source-policy, ci-image, components, test, real-backends, lint, typecheck, security, image-scan, perf-gate, frontend]
    runs-on: [fleet-ci-v1, ci-small]
    timeout-minutes: 2
    env:
      REQUIRED_JOBS: '["source-policy","ci-image","components","test","real-backends","lint","typecheck","security","image-scan","perf-gate","frontend"]'
    steps:
      - name: Reject missing, failed, cancelled or skipped required jobs
        id: verify
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os
          actual = json.loads(os.environ['NEEDS_JSON'])
          expected = json.loads(os.environ['REQUIRED_JOBS'])
          if set(actual) != set(expected) or not actual:
              raise SystemExit('Missing required CI results')
          if any(row.get('result') != 'success' for row in actual.values()):
              raise SystemExit('Required CI jobs did not all succeed')
          PY
