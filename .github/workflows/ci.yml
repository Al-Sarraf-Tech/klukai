name: Klukai CI
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  light-acceptance:
    name: Light slot ${{ matrix.slot }}
    runs-on: [fleet-ci-v1, ci-small]
    timeout-minutes: 5
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        slot: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - name: Verify one-job container bounds and public egress
        shell: bash
        run: |
          set -euo pipefail
          test "$(id -u)" = 1000
          test ! -S /var/run/docker.sock
          test "$(cat /sys/fs/cgroup/memory.max)" = 4294967296
          test "$(cat /sys/fs/cgroup/memory.swap.max)" = 0
          test "$(cat /sys/fs/cgroup/cpu.max)" = '200000 100000'
          test "$(cat /sys/fs/cgroup/pids.max)" = 512
          python3 - <<'PY'
          import errno, socket, ssl
          from pathlib import Path
          assert Path('/opt/fleet-ci/job-started.sh').stat().st_uid == 0
          with socket.create_connection(('api.github.com',443),timeout=10) as s:
              with ssl.create_default_context().wrap_socket(s,server_hostname='api.github.com') as tls:
                  tls.sendall(b'HEAD / HTTP/1.1\r\nHost: api.github.com\r\nUser-Agent: fleet-ci-acceptance\r\nConnection: close\r\n\r\n')
                  assert tls.recv(128).startswith(b'HTTP/1.1 ')
          for ip in ('10.253.72.1','100.107.121.5','192.168.1.1','169.254.169.254'):
              try:
                  c=socket.create_connection((ip,443),timeout=2)
              except (TimeoutError,OSError) as error:
                  if isinstance(error,OSError) and error.errno not in (None,errno.ENETUNREACH,errno.EHOSTUNREACH):
                      raise
              else:
                  c.close();raise AssertionError('Private egress was reachable')
          print('Nonroot, cgroup limits, TLS/DNS and sampled private egress verified')
          PY
      - name: Hold all eight slots for host-side concurrency evidence
        run: sleep 60
