name: Klukai CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test Suite
    runs-on: [self-hosted, python-slim]
    defaults:
      run:
        working-directory: docker/core

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-timeout pytest-cov

      - name: Run test suite with coverage
        run: python3 -m pytest tests/ -q --tb=short --cov=app --cov-report=term-missing --cov-fail-under=49

  lint:
    name: Lint
    runs-on: [self-hosted, python-slim]
    defaults:
      run:
        working-directory: docker/core

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install ruff

      - name: Lint with ruff
        run: ruff check app/ --config ruff.toml

  typecheck:
    name: Type Check (mypy)
    runs-on: [self-hosted, python-slim]
    defaults:
      run:
        working-directory: docker/core

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install mypy types-PyYAML

      - name: Type-check with mypy
        run: mypy app/ --config-file mypy.ini

  security:
    name: Security Scan (bandit + safety)
    runs-on: [self-hosted, python-slim]
    defaults:
      run:
        working-directory: docker/core

    steps:
      - uses: actions/checkout@v4

      - name: Install scanners
        run: |
          python3 -m pip install --upgrade pip
          pip install bandit safety

      - name: SAST — bandit (high-severity only)
        run: bandit -r app/ -ll --skip B101

      - name: Dependency vulnerability — safety
        run: safety check --file requirements.txt --ignore 70612 || true

  image-scan:
    name: Image Scan (trivy)
    runs-on: [self-hosted, python-slim]

    steps:
      - uses: actions/checkout@v4

      - name: Check trivy availability
        id: trivy_check
        run: |
          if command -v trivy >/dev/null 2>&1; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            trivy --version
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "trivy not installed on runner — skipping image scan"
            echo "Install instructions: https://aquasecurity.github.io/trivy/latest/getting-started/installation/"
          fi

      - name: Build image
        if: steps.trivy_check.outputs.available == 'true'
        run: docker build -t klukai-core:ci -f docker/core/Dockerfile docker/core/

      - name: Trivy scan — HIGH + CRITICAL fail
        if: steps.trivy_check.outputs.available == 'true'
        run: |
          trivy image \
            --severity HIGH,CRITICAL \
            --exit-code 1 \
            --ignore-unfixed \
            --no-progress \
            klukai-core:ci

      - name: Trivy scan — full report (informational)
        if: steps.trivy_check.outputs.available == 'true'
        run: |
          trivy image \
            --severity LOW,MEDIUM,HIGH,CRITICAL \
            --no-progress \
            klukai-core:ci || true


