<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="description" content="H.I.D.E. 404 Neural Link — Commander Interface">

  <meta name="theme-color" content="#12151E">
  <meta name="color-scheme" content="dark">

  <!-- iOS: home-screen app, full-bleed under the status bar (the app pads
       itself with env(safe-area-inset-*)), proper name and icon. -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Klukai">
  <meta name="format-detection" content="telephone=no">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <style>
    /* Matches the app background so overscroll, the notch area and the
       moment before Flutter paints never flash white. */
    html, body { background: #12151E; margin: 0; overscroll-behavior: none; }
  </style>

  <title>Klukai</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!-- Markdown parser + Pretext text measurement -->
  <script src="js/marked.min.js"></script>
  <script type="module">
    import * as pretext from './js/pretext/layout.js';
    window.__pretext = pretext;
    window.__pretextReady = true;
  </script>
  <script src="js/pretext_bridge.js"></script>
  <script src="js/audio_recorder.js"></script>
  <script src="js/voice.js"></script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
