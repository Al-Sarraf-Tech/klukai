# mutmut 3.x configuration for the nightly mutation-test job
# (.github/workflows/nightly.yml). Run from docker/core with an ABSOLUTE
# PERSONALITY_PATH — mutmut executes tests from its mutants/ copy, which breaks
# the conftest's relative-path fallback.
#
# also_copy must include everything tests reach by path from the mutants/ tree:
# the full app package, pytest.ini, and the dev scripts that meta-tests read.
[mutmut]
source_paths=
    app/affection.py
    app/audit_chain.py
    app/personality/speech.py
also_copy=
    app/
    pytest.ini
    seed_memories.py
    reannotate_existing.py
