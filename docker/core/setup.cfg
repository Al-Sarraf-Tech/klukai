# Run via python -m tools.ci.mutation for isolated, observed execution.
# Keep extracted scoring/classifier implementations within the critical scope.
[mutmut]
source_paths=
    app/affection.py
    app/affection_classifier.py
    app/affection_types.py
    app/audit_chain.py
    app/personality/speech.py
also_copy=
    app/
    pytest.ini
    seed_memories.py
pytest_add_cli_args=
    -p
    mutation_observer
    -W
    error
pytest_add_cli_args_test_selection=
    tests/test_affection_pure.py
    tests/test_affection_coverage.py
    tests/test_affection_system.py
    tests/test_affection_timeline.py
    tests/test_affection_mutants.py
    tests/test_audit_chain_mutants.py
    tests/test_speech_routing_mutants.py
    tests/test_speech_intimacy_gate.py
    tests/test_background_callers_haiku.py::test_legacy_affection_classifier_on_haiku
    tests/test_background_callers_haiku.py::test_legacy_classifier_failures_are_neutral
    tests/test_background_callers_haiku.py::test_legacy_classifier_uses_a_custom_template
    tests/test_security_integrity_fixes.py
    tests/test_personality_pure.py
    tests/test_personality_contract.py
    tests/test_critical_mutation_contracts.py
    tests/test_critical_speech_contracts.py
