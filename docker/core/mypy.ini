[mypy]
python_version = 3.13
ignore_missing_imports = True
no_strict_optional = True
warn_unused_ignores = True
exclude = (?x)(
    ^tests/
    | ^seed_memories\.py$
    | ^reannotate_existing\.py$
  )

# ── Per-module type-debt baseline (Phase 1 floor) ────────────────────────────
# Each entry below is a TODO. Phase 2 lifts these one at a time. Do NOT add
# new modules here — fix at write time instead.

[mypy-app.metrics]
disable_error_code = misc

[mypy-app.physical_state]
disable_error_code = index

[mypy-app.memory_archive]
disable_error_code = attr-defined

[mypy-app.llm_router]
disable_error_code = arg-type

[mypy-app.routes]
# redis.asyncio ping() returns Awaitable[bool] | bool in newer stubs; the
# CI mypy stub version differs from local. Treating as Phase 2 cleanup —
# the actual call site (line 180) is correct at runtime.
disable_error_code = misc

[mypy-app.observability.health_cache]
# Same redis.asyncio stub mismatch — `await asyncio.wait_for(r.ping(), ...)`
# trips the same Awaitable[bool] | bool issue. Phase 4 will swap the
# redis client for one with stable stubs.
disable_error_code = arg-type
