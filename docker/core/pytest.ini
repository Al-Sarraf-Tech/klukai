[pytest]
asyncio_mode = auto
# perf probes the LIVE stack's latency — under a full-suite CPU load it flakes,
# so it only runs when asked for: `pytest -m perf` (a later -m overrides this).
addopts = -m "not perf"
markers =
    integration: tests that require a live PG/Redis/Qdrant stack
    perf: perf-gate tests that probe a live stack (run explicitly with -m perf)
cache_dir = /tmp/pytest_cache
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
