# Run on amarillo: bridges aichat internals to Tailscale + reverse proxies web to dominus
services:
  companion-gateway:
    image: nginx:alpine
    container_name: companion-gateway
    mem_limit: 256m
    ports:
      # companion-core serves 8300 directly now (no longer proxied)
      # aichat HTTP services on Tailscale
      - "100.111.198.19:18105:18105"  # Inference
      # aichat TCP services on Tailscale
      # Redis (16379) is deliberately NOT published: aichat-redis has no auth and
      # every legitimate client (companion-core, events-bridge) reaches it on the
      # aichat_default Docker network. Security fix 2026-10-27.
      - "100.111.198.19:15432:15432"  # PostgreSQL
      # Qdrant (16333) is deliberately NOT published either (no API key). Security fix 2026-10-27.
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - aichat_default
      - infra
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "nginx -t 2>/dev/null && kill -0 $(cat /tmp/nginx.pid 2>/dev/null || cat /var/run/nginx.pid 2>/dev/null) 2>/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 3
    labels:
      autoheal: "true"

networks:
  aichat_default:
    external: true
  infra:
    external: true
