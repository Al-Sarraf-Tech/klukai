# Run on amarillo: publishes infra-postgres on the tailnet (15432).
services:
  companion-gateway:
    image: nginx:alpine
    container_name: companion-gateway
    mem_limit: 256m
    ports:
      # companion-core serves 8300 directly now (no longer proxied).
      # The aichat stack's inference (18105), Redis, Qdrant, data and MCP
      # services are not published (aichat decoupling, 2026-10-27).
      - "100.111.198.19:15432:15432"  # PostgreSQL
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - infra
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "nginx -t 2>/dev/null && kill -0 $(cat /tmp/nginx.pid 2>/dev/null || cat /var/run/nginx.pid 2>/dev/null) 2>/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 3
    labels:
      autoheal: "true"

networks:
  infra:
    external: true
