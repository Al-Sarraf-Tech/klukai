worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
    worker_connections 256;
}

http {
    access_log /dev/stdout;

    # ── Reverse proxy: web traffic → dominus companion-core ──────────────
    upstream companion_core {
        server 100.78.39.76:8300;
    }

    server {
        listen 8300;

        # WebSocket support
        location /ws {
            proxy_pass http://companion_core;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        location / {
            proxy_pass http://companion_core;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }

    # ── HTTP proxies for aichat services → Tailscale only ────────────────

    # aichat-mcp (MCP gateway)
    server {
        listen 18096;
        location / {
            proxy_pass http://aichat-aichat-mcp-1:8096;
            proxy_set_header Host $host;
            proxy_read_timeout 300s;  # MCP tools can be slow
        }
    }

    # aichat-data (memory, graph, planner, jobs, embeddings)
    server {
        listen 18091;
        location / {
            proxy_pass http://aichat-aichat-data-1:8091;
            proxy_set_header Host $host;
        }
    }

    # aichat-inference (embeddings) - already on host:8105 but proxy for consistency
    server {
        listen 18105;
        location / {
            proxy_pass http://aichat-aichat-inference-1:8105;
            proxy_set_header Host $host;
        }
    }
}

# ── TCP stream proxies: expose aichat internals to Tailscale ─────────────
stream {
    # PostgreSQL (aichat-db)
    server {
        listen 15432;
        proxy_pass aichat-aichat-db-1:5432;
    }

    # Redis (aichat-redis)
    server {
        listen 16379;
        proxy_pass aichat-aichat-redis-1:6379;
    }

    # Qdrant (aichat-vector)
    server {
        listen 16333;
        proxy_pass aichat-aichat-vector-1:6333;
    }
}
