worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
    worker_connections 256;
}

# ── TCP stream proxy: infra-postgres on the tailnet ─────────────────────
# Nothing from the aichat stack is proxied (aichat decoupling, 2026-10-27).
stream {
    server {
        listen 15432;
        proxy_pass infra-postgres:5432;
    }
}
