worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
    worker_connections 256;
}

http {
    access_log /dev/stdout;
    resolver 127.0.0.11 valid=10s ipv6=off;

    # companion-core serves 8300 directly on amarillo (no longer proxied)

    # ── HTTP proxies for aichat services → host overlay bindings ────────

    # aichat-mcp (MCP gateway)
    server {
        listen 18096;
        location / {
            set $mcp_upstream aichat-aichat-mcp-1;
            proxy_pass http://$mcp_upstream:8096;
            proxy_set_header Host $host;
            proxy_read_timeout 300s;
        }
    }

    # aichat-data (memory, graph, planner, jobs, embeddings)
    server {
        listen 18091;
        location / {
            set $data_upstream aichat-aichat-data-1;
            proxy_pass http://$data_upstream:8091;
            proxy_set_header Host $host;
        }
    }

    # aichat-inference (embeddings)
    server {
        listen 18105;
        location / {
            set $inference_upstream aichat-aichat-inference-1;
            proxy_pass http://$inference_upstream:8105;
            proxy_set_header Host $host;
        }
    }
}

# ── TCP stream proxies: expose aichat internals to host overlays ─────────
stream {
    # PostgreSQL (aichat-db)
    server {
        listen 15432;
        proxy_pass infra-postgres:5432;
    }

    # Redis is intentionally not proxied (unauthenticated; Docker-network only).

    # Qdrant is intentionally not proxied (no API key; Docker-network only). Security fix 2026-10-27.
}
